name: browser-e2e-ci

# Browser E2E for admin-web golden paths (GitHub Issue #2).
# - pull_request: only for PRs targeting dev / main (repo rule: no
#   Actions for non-dev PRs), and only when E2E-relevant paths change.
# - The job starts the disposable stack from
#   apps/admin-web/e2e/docker-compose.e2e.yml, seeds the local
#   super-admin, and runs Playwright against it. No production
#   credentials are involved; every secret below is a throwaway value
#   defined inside the E2E compose file itself.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'apps/admin-web/**'
      - 'services/website-services/Dockerfile'
      - 'services/website-services/scripts/local/seed-admin-hqjiayou-super.sql'
      - 'deploy/Caddyfile'
      - '.github/workflows/browser-e2e-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: admin-web browser E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/admin-web/pnpm-lock.yaml

      - name: Generate throwaway auth JWT keys
        run: |
          mkdir -p e2e/secrets
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out e2e/secrets/auth-private.pem
          openssl rsa -pubout -in e2e/secrets/auth-private.pem -out e2e/secrets/auth-public.pem

      - name: Start E2E stack
        run: docker compose -f e2e/docker-compose.e2e.yml up -d --build --wait --wait-timeout 1200 postgres redis seaweedfs admin auth gateway admin-web

      - name: Create media bucket
        run: docker compose -f e2e/docker-compose.e2e.yml run --rm s3-init

      - name: Seed super-admin (repo local seed)
        run: docker compose -f e2e/docker-compose.e2e.yml exec -T postgres psql -U mywebsite -d my_website_e2e < ../../services/website-services/scripts/local/seed-admin-hqjiayou-super.sql

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E
        env:
          E2E_BASE_URL: http://localhost:8081
        run: pnpm test:e2e

      - name: Stack logs (on failure)
        if: failure()
        run: docker compose -f e2e/docker-compose.e2e.yml logs --tail 200 || true

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/admin-web/playwright-report
            apps/admin-web/test-results
          retention-days: 7

      - name: Teardown
        if: always()
        run: docker compose -f e2e/docker-compose.e2e.yml down -v || true

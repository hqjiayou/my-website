name: agent-services-ci

# Python AI 执行服务 services/agent-services，以及 Java HttpAgentClient 契约。
# - pull_request：按指向 dev / main 的整个 PR 改动触发，不只看最后一次 push。
# - push：按本次 push 改到的路径触发（含尚未开 PR 的功能分支）。
# pytest 通过后，Java 契约 IT 与 Docker 镜像构建并行。

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'services/agent-services/**'
      - 'services/website-services/agent/**'
      - '.github/workflows/agent-services-ci.yml'
  push:
    paths:
      - 'services/agent-services/**'
      - 'services/website-services/agent/**'
      - '.github/workflows/agent-services-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: agent-services pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/agent-services
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - name: uv sync
        run: uv sync --frozen --extra dev
      - name: pytest
        run: uv run python -m pytest -v

  java-python-contract:
    name: HttpAgentClient ↔ Python contract
    runs-on: ubuntu-latest
    needs: python-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare Python venv
        working-directory: services/agent-services
        run: uv sync --frozen --extra dev
      - name: mvn agent contract IT
        working-directory: services/website-services
        env:
          AGENT_PYTHON_CONTRACT_IT: 'true'
        run: |
          mvn -B -ntp -pl agent -am install -DskipTests
          mvn -B -ntp -pl agent test -Dtest=HttpAgentClientPythonContractIT

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: python-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        working-directory: services/agent-services
        run: docker build -t agent-services:ci .
      # 报告模式：只输出 HIGH/CRITICAL 且有修复版本的漏洞，不阻断合并；
      # 存量清理后另行收紧为 exit-code 1。
      - name: Trivy image scan (report-only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agent-services:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

  lint:
    name: agent-services ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/agent-services
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - name: uv sync
        run: uv sync --frozen --extra dev
      - name: ruff check
        run: uv run ruff check src tests

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/agent-services
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - name: uv sync
        run: uv sync --frozen --extra dev
      - name: Export runtime requirements
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/requirements-audit.txt
      # 报告模式：存量漏洞清理前不阻断；清理完成另行去掉 continue-on-error。
      - name: pip-audit (report-only)
        continue-on-error: true
        run: uv run pip-audit -r /tmp/requirements-audit.txt

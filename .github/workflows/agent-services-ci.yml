name: agent-services-ci

# Python AI 执行服务 services/agent-services，以及 Java HttpAgentClient 契约。
# - pull_request：按指向 dev / main 的整个 PR 改动触发，不只看最后一次 push。
# - push：按本次 push 改到的路径触发（含尚未开 PR 的功能分支）。
# pytest 通过后，Java 契约 IT 与 Docker 镜像构建并行。

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'services/agent-services/**'
      - 'services/website-services/agent/**'
      - '.github/workflows/agent-services-ci.yml'
  push:
    paths:
      - 'services/agent-services/**'
      - 'services/website-services/agent/**'
      - '.github/workflows/agent-services-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: agent-services pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/agent-services
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - name: uv sync
        run: uv sync --frozen --extra dev
      - name: pytest
        run: uv run python -m pytest -v

  java-python-contract:
    name: HttpAgentClient ↔ Python contract
    runs-on: ubuntu-latest
    needs: python-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare Python venv
        working-directory: services/agent-services
        run: uv sync --frozen --extra dev
      - name: mvn agent contract IT
        working-directory: services/website-services
        env:
          AGENT_PYTHON_CONTRACT_IT: 'true'
        run: |
          mvn -B -ntp -pl agent -am install -DskipTests
          mvn -B -ntp -pl agent test -Dtest=HttpAgentClientPythonContractIT

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: python-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        working-directory: services/agent-services
        run: docker build -t agent-services:ci .

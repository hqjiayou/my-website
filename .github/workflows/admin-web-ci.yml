name: admin-web-ci

# 只在本次变更改到 admin-web 或本工作流时运行（push 与 PR 同规则）。

on:
  push:
    paths:
      - 'apps/admin-web/**'
      - '.github/workflows/admin-web-ci.yml'
  pull_request:
    paths:
      - 'apps/admin-web/**'
      - '.github/workflows/admin-web-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: admin-web lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/admin-web/pnpm-lock.yaml
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: build
        run: pnpm build

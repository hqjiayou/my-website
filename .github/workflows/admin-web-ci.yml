name: admin-web-ci

# 后台总控 apps/admin-web。
# - pull_request：按指向 dev / main 的整个 PR 改动触发，不只看最后一次 push。
# - push：仅 dev / main 分支按本次 push 改到的路径触发（功能分支 push 不再触发，避免与 PR 重复跑）。
# lint / 导入检查 / build 不是浏览器 E2E。

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'apps/admin-web/**'
      - '.github/workflows/admin-web-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'apps/admin-web/**'
      - '.github/workflows/admin-web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: admin-web lint, imports, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/admin-web/pnpm-lock.yaml
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: check imports
        run: node scripts/check-imports.mjs
      - name: check import casing
        run: node scripts/check-import-casing.mjs
      - name: build
        run: pnpm build
      - name: check agent platform boundary
        run: pnpm test:boundary
      - name: check table foundation
        run: pnpm test:table
      - name: check preview SSE
        run: pnpm test:sse
      - name: install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: mock E2E
        run: pnpm test:e2e:mock

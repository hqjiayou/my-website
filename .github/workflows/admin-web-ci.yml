name: admin-web-ci

# 路径未命中时检查任务跳过，gate 仍成功，供 dev/main 分支保护使用。

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  changes:
    name: Detect admin-web changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -Eq '^(apps/admin-web/|\.github/workflows/admin-web-ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  lint-and-build:
    name: admin-web lint and build
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/admin-web/pnpm-lock.yaml
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: build
        run: pnpm build

  gate:
    name: admin-web-ci
    needs: [changes, lint-and-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require relevant jobs to pass
        run: |
          set -eu
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "change detection failed"
            exit 1
          fi
          case "${{ needs.lint-and-build.result }}" in
            success|skipped) ;;
            *) echo "job result: ${{ needs.lint-and-build.result }}"; exit 1 ;;
          esac

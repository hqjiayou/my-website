# CLIProxyAPI 本地附加组件最小配置（v8 版式，字段名与上游 config.example.yaml 对齐）。
#
# access.api-keys 下的占位 key 是「客户端认证 key」——
# 调用方（本仓库 admin 后台的 CLI 模式模型入口）用它来认证对本代理的请求，
# 不是任何上游 AI 服务商的账号密钥。
# 使用前必须把它改成自己的随机值，并且要与 admin 后台「模型入口」里
# CLI 模式那条记录填写的 apiKey 保持一致，否则调用会被拒绝。
config-version: 8

server:
  port: 8317

access:
  api-keys:
    - "CHANGE_ME-cliproxy-client-key"

# 自架 + Tailscale。只有 web 对宿主发布端口。
# 宿主 80 → 容器 8080：tailscale serve 指向 http://127.0.0.1:80。Caddy 不做 TLS。
# 宿主 127.0.0.1:8081 → 容器 8081：admin-web。vite base 不能用环境变量改，所以不挂 /admin/。
# 其余服务只在 compose 网络里。环境变量用仓库根 .env 做 ${} 替换，不把整份 .env 灌进每个容器
# （AI_PROVIDER_API_KEY 只进入 agent）。
# Java heap 各 -Xmx384m。方案文件按三个 JVM 估算 1.8–2.2GB；这里按 brief 加了 admin，共四个。

x-java-db: &java-db
  JAVA_OPTS: "-Xmx384m"
  DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
  DB_USERNAME: "${POSTGRES_USER}"
  DB_PASSWORD: "${POSTGRES_PASSWORD}"
  POSTGRES_DB: "${POSTGRES_DB}"
  POSTGRES_USER: "${POSTGRES_USER}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  AGENT_BASE_URL: "http://agent:3001"
  AGENT_INTERNAL_SERVICE_TOKEN: "${AGENT_INTERNAL_SERVICE_TOKEN}"
  AUTH_JWKS_URI: "http://auth:8083/.well-known/jwks.json"
  SECURITY_REFRESH_COOKIE_SECURE: "${SECURITY_REFRESH_COOKIE_SECURE:-false}"
  FLYWAY_ENABLED: "${FLYWAY_ENABLED:-true}"
  AGENT_APP_FLYWAY_ENABLED: "${AGENT_APP_FLYWAY_ENABLED:-false}"

x-java-health: &java-health
  interval: 15s
  timeout: 5s
  retries: 20
  start_period: 120s

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      # 只给一次性建检索库的命令用。postgres 镜像不读这三个变量。
      AGENT_RETRIEVAL_DB: "${AGENT_RETRIEVAL_DB}"
      AGENT_RETRIEVAL_USER: "${AGENT_RETRIEVAL_USER}"
      AGENT_RETRIEVAL_PASSWORD: "${AGENT_RETRIEVAL_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    # 本机调试数据库时可取消注释（只绑回环）：
    # ports:
    #   - "127.0.0.1:5432:5432"

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDISCLI_AUTH: "${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    # 本机调试 Redis 时可取消注释（只绑回环）：
    # ports:
    #   - "127.0.0.1:6379:6379"

  admin:
    build:
      context: .
      dockerfile: services/website-services/Dockerfile
      args:
        MODULE: admin
        JAR_GLOB: admin/target/admin-*.jar
        EXPOSE_PORT: "8081"
    restart: unless-stopped
    environment:
      <<: *java-db
      AGENT_BUSINESS_API_BASE_URL: "http://agent-service:8082"
      AI_MODEL_ENTRY_SECRET: "${AI_MODEL_ENTRY_SECRET:-local-dev-model-entry-secret}"
      PROXY_SERVICES_BASE_URL: "http://proxy-services:8317"
      PROXY_INTERNAL_SERVICE_TOKEN: "${PROXY_INTERNAL_SERVICE_TOKEN:-}"
    depends_on:
      postgres:
        condition: service_healthy
      proxy-services:
        condition: service_started
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health >/dev/null"]

  auth:
    build:
      context: .
      dockerfile: services/website-services/Dockerfile
      args:
        MODULE: auth
        JAR_GLOB: auth/target/auth-*.jar
        EXPOSE_PORT: "8083"
    restart: unless-stopped
    environment:
      <<: *java-db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      AUTH_APP_PORT: "8083"
      AUTH_DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
      AUTH_DB_USERNAME: "${POSTGRES_USER}"
      AUTH_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      AUTH_REDIS_HOST: redis
      AUTH_REDIS_PORT: "6379"
      AUTH_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      AUTH_JWT_PRIVATE_KEY_PATH: "${AUTH_JWT_PRIVATE_KEY_PATH}"
      AUTH_JWT_PUBLIC_KEY_PATH: "${AUTH_JWT_PUBLIC_KEY_PATH}"
      AUTH_JWT_KEY_ID: "${AUTH_JWT_KEY_ID:-auth-local-rs256-key-1}"
    volumes:
      - ./services/website-services/secrets/local:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/actuator/health >/dev/null"]

  agent-service:
    build:
      context: .
      dockerfile: services/website-services/Dockerfile
      args:
        MODULE: agent/agent-app
        JAR_GLOB: agent/agent-app/target/agent-app-*.jar
        EXPOSE_PORT: "8082"
    restart: unless-stopped
    environment:
      <<: *java-db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      AGENT_BUSINESS_API_BASE_URL: "http://agent-service:8082"
      AI_MODEL_ENTRY_SECRET: "${AI_MODEL_ENTRY_SECRET:-local-dev-model-entry-secret}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/actuator/health >/dev/null"]

  gateway:
    build:
      context: .
      dockerfile: services/website-services/Dockerfile
      args:
        MODULE: gateway
        JAR_GLOB: gateway/target/gateway-*.jar
        EXPOSE_PORT: "8080"
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xmx384m"
      # application.yml 里上游写死 localhost。这里用环境变量覆盖，不改那份文件。
      # 顺序保持 auth → admin → agent-service。本机没有 Docker，绑定是否生效要在目标主机上看启动日志。
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_ID: auth-service-api
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI: "http://auth:8083"
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0: "Path=/api/auth/**"
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_ID: admin-service
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_URI: "http://admin:8081"
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_PREDICATES_0: "Path=/api/admin/**"
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_ID: agent-service
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_URI: "http://agent-service:8082"
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_PREDICATES_0: "Path=/api/agent/**"
    depends_on:
      auth:
        condition: service_healthy
      agent-service:
        condition: service_healthy
      admin:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null"]

  agent:
    build:
      context: services/agent-services
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3001"
      AGENT_INTERNAL_SERVICE_TOKEN: "${AGENT_INTERNAL_SERVICE_TOKEN}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_PROVIDER_API_KEY: "${AI_PROVIDER_API_KEY:-}"
      RETRIEVAL_DATABASE_URL: "postgresql://${AGENT_RETRIEVAL_USER}:${AGENT_RETRIEVAL_PASSWORD}@postgres:5432/${AGENT_RETRIEVAL_DB}"
      AI_EMBEDDING_MODEL: "${AI_EMBEDDING_MODEL:-}"
      AI_EMBEDDING_DIMENSIONS: "${AI_EMBEDDING_DIMENSIONS:-1536}"
      BUSINESS_API_BASE_URL: "http://agent-service:8082"
      AGENT_SKILLS_DIR: /app/skills
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  proxy-services:
    build:
      context: services/proxy-services
      dockerfile: Dockerfile
    image: mywebsite-proxy-services:local
    restart: unless-stopped
    environment:
      MANAGEMENT_PASSWORD: "${PROXY_INTERNAL_SERVICE_TOKEN:?PROXY_INTERNAL_SERVICE_TOKEN must be set to a local random value (proxy management password)}"
    ports:
      # 只绑回环：本机 admin 与 OAuth 回调。compose 网络内用服务名 proxy-services。
      - "127.0.0.1:8317:8317"
      - "127.0.0.1:8085:8085"
      - "127.0.0.1:1455:1455"
      - "127.0.0.1:54545:54545"
      - "127.0.0.1:51121:51121"
      - "127.0.0.1:11451:11451"
    volumes:
      - ./services/proxy-services/config.yaml:/CLIProxyAPI/config.yaml
      - ./services/proxy-services/auths:/root/.cli-proxy-api
      - ./services/proxy-services/logs:/CLIProxyAPI/logs
      - ./services/proxy-services/plugins:/CLIProxyAPI/plugins

  web:
    build:
      context: .
      dockerfile: apps/agent-portal/Dockerfile
      args:
        VITE_PORTAL_AGENT_ID: "${VITE_PORTAL_AGENT_ID:-}"
    restart: unless-stopped
    ports:
      - "80:8080"
      - "127.0.0.1:8081:8081"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres_data:

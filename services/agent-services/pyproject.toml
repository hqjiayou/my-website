[project]
name = "agent-services"
version = "0.5.3"
description = "Python AI Execution Runtime for my-website (internal only)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "pydantic-ai-slim[google,mcp,openai]>=2.54.0,<3",
    "fastmcp-slim[client]>=4.0.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "asyncpg>=0.30",
    "httpx>=0.28.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.0",
    "pydantic-evals>=2.54.0,<3",
    # no-build-isolation 模式下本地 editable 构建所需（见 [tool.uv]）
    "hatchling>=1.25",
    "editables>=0.5",
    # CI 工具：lint 与依赖漏洞扫描（版本随 uv.lock 锁定）
    "ruff>=0.14",
    "pip-audit>=2.7",
]

[tool.uv]
# Windows 应用控制策略会阻止 uv 隔离构建的临时 venv 运行；
# 本地项目改用项目 venv 直接构建（构建依赖已入 dev extras）
no-build-isolation-package = ["agent-services"]

[tool.uv.extra-build-dependencies]
agent-services = ["hatchling"]

[project.scripts]
agent-services = "agent_services.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "fastmcp-slim[server]>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# 最小规则集起步：语法/明显错误（E4,E7,E9）、Pyflakes（F）、导入排序（I）。
# 不启用 E501 与 format 校验，避免一次性大范围改动；扩规则另行评审。
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

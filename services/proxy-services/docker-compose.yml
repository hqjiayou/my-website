name: proxy-services

services:
  proxy-services:
    build:
      context: .
      dockerfile: Dockerfile
    image: mywebsite-proxy-services:local
    container_name: proxy-services
    restart: unless-stopped
    environment:
      # 打开管理接口，并允许经 Docker 端口映射访问（进程看到的来源不是容器内回环）。
      # 口令与 admin 的 PROXY_SERVICES_MANAGEMENT_KEY 保持一致。端口只绑 127.0.0.1。
      MANAGEMENT_PASSWORD: ${PROXY_SERVICES_MANAGEMENT_KEY:?PROXY_SERVICES_MANAGEMENT_KEY must be set to a local random value (proxy management password)}
    ports:
      - "127.0.0.1:8317:8317"
      - "127.0.0.1:8085:8085"
      - "127.0.0.1:1455:1455"
      - "127.0.0.1:54545:54545"
      - "127.0.0.1:51121:51121"
      - "127.0.0.1:11451:11451"
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml
      - ./auths:/root/.cli-proxy-api
      - ./logs:/CLIProxyAPI/logs
      - ./plugins:/CLIProxyAPI/plugins

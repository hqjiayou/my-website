# 持久层真实 PostgreSQL 回归验证：与 admin 共用 infra 内 Flyway 脚本（classpath:db/migration），验证 site / site_user Mapper。
# 数据源账号默认与 website-services/.env 中 POSTGRES_*（local-stack Postgres）对齐；可被 VERIFY_PG_* 覆盖。
spring:
  datasource:
    url: ${VERIFY_PG_URL:jdbc:postgresql://localhost:5432/my_website_3c_verify}
    username: ${VERIFY_PG_USER:${POSTGRES_USER:hqjiayou}}
    password: ${VERIFY_PG_PASSWORD:${POSTGRES_PASSWORD:hqjiayou}}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

storage:
  minio:
    endpoint: http://127.0.0.1:19000
    access-key: test
    secret-key: test
    bucket: test
    secure: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

spring:
  application:
    name: site-service
  profiles:
    default: local
  flyway:
    enabled: ${SITE_APP_FLYWAY_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

server:
  port: 8082

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

security:
  jwt:
    issuer: my-website
    audience: ADMIN
    access-token-ttl: 30m

spring:
  application:
    name: site-service
  profiles:
    default: local
  flyway:
    enabled: ${SITE_APP_FLYWAY_ENABLED:false}
  messages:
    basename: i18n/common/messages,i18n/auth/messages
    encoding: UTF-8
    fallback-to-system-locale: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

server:
  port: 8082

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  i18n:
    default-locale: ja-JP
    supported-locales:
      - ja-JP
      - zh-CN
      - en-US

security:
  jwt:
    issuer: my-website
    audience: ADMIN
    access-token-ttl: 30m

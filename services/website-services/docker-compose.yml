# 本地开发依赖（PostgreSQL / Redis）；凭据仅限本机开发，请勿用于生产。
# Postgres：仅在「数据目录首次为空」时根据 POSTGRES_DB 自动建库；旧 volume 若缺库请见 scripts/README.md。
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_website_dev}
      POSTGRES_USER: ${POSTGRES_USER:-hqjiayou}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hqjiayou}
    volumes:
      - website-services-pg-dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

volumes:
  website-services-pg-dev:

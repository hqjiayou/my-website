# 本地开发依赖（PostgreSQL / Redis）；凭据仅限本机开发，请勿用于生产。
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_website_dev}
      POSTGRES_USER: ${POSTGRES_USER:-mywebsite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
    volumes:
      - website-services-pg-dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

volumes:
  website-services-pg-dev:

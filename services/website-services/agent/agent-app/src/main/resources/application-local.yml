# 数据库 / Redis / MinIO 等本地连接信息在 `.env`（范本 `.env.example`）中维护。
# JDBC 默认与 POSTGRES_* 对齐；未加载 `.env` 时仍有合法 jdbc URL。

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:my_website_dev}}
    username: ${DB_USERNAME:${POSTGRES_USER:mywebsite}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:CHANGE_ME}}
  flyway:
    # 与 admin 共用同一库时须避免双应用各跑一套 migration；DDL 由 infra classpath:db/migration 单一维护，默认建议仅 admin 执行迁移
    enabled: ${AGENT_APP_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:CHANGE_ME}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

mywebsite:
  ai:
    model-entry-secret: ${AI_MODEL_ENTRY_SECRET:local-dev-model-entry-secret}
  agent:
    business-api-base-url: ${AGENT_BUSINESS_API_BASE_URL:http://127.0.0.1:8082}

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:CHANGE_ME}
    secret-key: ${MINIO_SECRET_KEY:CHANGE_ME}
    bucket: ${MINIO_BUCKET:uploads}
    secure: ${MINIO_SECURE:false}

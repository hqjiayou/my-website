# 测试 Profile：内存 H2，仅用于 Spring 与 MyBatis-Plus / Mapper Bean 冒烟；不执行 Flyway、不跑真实 CRUD 用例。
# JWKS 由集成测试类 AbstractAgentSpringBootTest 动态注册。
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

security:
  jwt:
    issuer: test-issuer
    audience: AGENT

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:site_app_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-ai-h2.sql
  flyway:
    enabled: false
  messages:
    basename: i18n/common/messages,i18n/auth/messages
    encoding: UTF-8
    fallback-to-system-locale: false

app:
  i18n:
    default-locale: ja-JP
    supported-locales:
      - ja-JP
      - zh-CN
      - en-US

storage:
  minio:
    endpoint: http://127.0.0.1:19000
    access-key: test
    secret-key: test
    bucket: test
    secure: false

mywebsite:
  agent:
    # 由 AbstractAgentSpringBootTest DynamicPropertySource 覆盖为进程内 stub
    base-url: http://127.0.0.1:9
    internal-service-token: unused-until-overridden
  agent:
    ai:
      rate-limit-enabled: true
      rate-limit-per-minute: 100

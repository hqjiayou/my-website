server:
  port: 8080
  # 不让 Boot 用入站 Forwarded / X-Forwarded-* 改写连接信息。
  # 对端是否被 SCG 用转发头覆盖，只由下面的 trusted-proxies 决定。
  forward-headers-strategy: none

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          # SCG 在对端匹配本正则时，用 X-Forwarded-For / Forwarded 的第一段覆盖 TCP 对端。
          # 第一段可由客户端伪造，限流键会跟着被换掉。(?!) 不匹配任何地址，因此不会覆盖。
          # 出站 X-Forwarded-For 由 ClientIpGatewayFilter 写成 TCP 对端。
          # 不要改成 .* 或前置 LB 网段；值不是 (?!) 时该 Filter 拒绝启动。
          trusted-proxies: "(?!)"
          x-forwarded:
            enabled: true
            for-append: true
          routes:
            # 顺序敏感：/api/auth/** 须在 /api/admin/**、/api/agent/** 之前，以免登录被业务路由吞掉。
            - id: auth-service-api
              uri: http://localhost:8083
              predicates:
                - Path=/api/auth/**
            - id: admin-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/admin/**
            - id: agent-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/agent/**
            # 对外 API 网关 /v1（UoW-2）：鉴权在 agent-app 的 gateway_access_key 过滤器做，这里只路由。
            - id: agent-service-v1
              uri: http://localhost:8082
              predicates:
                - Path=/v1/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

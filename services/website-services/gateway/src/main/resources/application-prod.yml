# 生产 profile（Issue #136）：trusted-proxies 固定为 (?!)，与 application.yml 相同。
#
# 启用：--spring.profiles.active=prod（或 SPRING_PROFILES_ACTIVE=prod）
# Spring Cloud Gateway 在对端匹配 trusted-proxies 时，会用 X-Forwarded-For / Forwarded
# 的第一段覆盖 TCP 对端。第一段可由客户端伪造。因此生产也不信任任何对端，
# 出站 X-Forwarded-For 由 ClientIpGatewayFilter 写成与 gateway 直连的地址。
# 不要用环境变量 SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_TRUSTED_PROXIES 改成 .* 或前置 LB 正则：
# 一旦匹配对端，就会重新打开上述覆盖。前置 LB 时，限流键是 LB 的对端地址。
spring:
  cloud:
    gateway:
      server:
        webflux:
          trusted-proxies: "(?!)"

# 暴露面收窄（Issue #141 UoW-3）：health 端点沿用 application.yml 的
# exposure（仅 health），但生产不外泄各 indicator 明细。
management:
  endpoint:
    health:
      show-details: never

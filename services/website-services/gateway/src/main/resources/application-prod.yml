# 生產 profile（Issue #1）：trusted-proxies 不得沿用 application.yml 的 dev 默認 ".*"。
#
# 啟用：--spring.profiles.active=prod（或 SPRING_PROFILES_ACTIVE=prod）
# 必填：環境變量 SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_TRUSTED_PROXIES，
#       值為「前置 LB 對端 IP」的 Java 正則（SCG 以正則匹配對端 host 字符串，不是 CIDR 語法；
#       覆蓋一個網段請寫等價正則，例如 LB 在 10.0.5.0/24 時用 '^10\.0\.5\.\d+$'）。
# 未設置時佔位符無法解析、啟動直接失敗（fail-fast），不會靜默退回信任任意對端。
#
# 注意：收窄 trusted-proxies 必須與網絡層限制成對——prod 下 gateway 只能被前置 LB 到達、
# 不得對不可信來源直連暴露（對端不被信任時 XForwardedHeadersFilter 不追加可信條目）。
# 口徑見 docs/operations/SECURITY.md 與 docs/operations/DEPLOYMENT.md。
spring:
  cloud:
    gateway:
      server:
        webflux:
          trusted-proxies: "${SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_TRUSTED_PROXIES}"

# 测试 Profile：内存 H2，仅用于 Spring 与 MyBatis-Plus / Mapper Bean 冒烟；不执行 Flyway、不跑真实 CRUD 用例。
# 与 `application-local.yml` 对齐：显式开启下划线 → 驼峰（MP 默认值亦多为 true）。
security:
  jwt:
    secret: test-signing-secret-at-least-32-bytes-long-xx
    access-token-ttl: 15m
    audience: ADMIN
    issuer: test-issuer
  auth:
    refresh-token-ttl: 7d
    refresh-cookie-secure: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

spring:
  datasource:
    url: jdbc:h2:mem:admin_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway:
    enabled: false

storage:
  minio:
    endpoint: http://127.0.0.1:19000
    access-key: test
    secret-key: test
    bucket: test
    secure: false

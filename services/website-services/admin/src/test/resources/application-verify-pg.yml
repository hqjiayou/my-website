# 持久层真实 PostgreSQL 回归验证（`verify-pg`）：默认由 Testcontainers 自举一次性 PostgreSQL 容器（可复现、CI 可跑），Flyway 迁移与 Mapper 联通性校验。
# 启用方式：根模块 Maven profile persistence-verify-pg（参见 docs/website-services/数据文档/持久层真实PostgreSQL验证说明.md）。
# 指向外部已存在 PG：设置 VERIFY_PG_URL=jdbc:postgresql://host:5432/db + VERIFY_PG_DRIVER=org.postgresql.Driver + VERIFY_PG_USER/VERIFY_PG_PASSWORD。
spring:
  datasource:
    url: ${VERIFY_PG_URL:jdbc:tc:postgresql:16-alpine:///my_website_verify}
    driver-class-name: ${VERIFY_PG_DRIVER:org.testcontainers.jdbc.ContainerDatabaseDriver}
    # Testcontainers PostgreSQLContainer 默认账号 test/test；外部 PG 场景由 VERIFY_PG_USER/VERIFY_PG_PASSWORD 覆盖。
    username: ${VERIFY_PG_USER:test}
    password: ${VERIFY_PG_PASSWORD:test}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8083/.well-known/jwks.json}

storage:
  minio:
    endpoint: http://127.0.0.1:19000
    access-key: test
    secret-key: test
    bucket: test
    secure: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

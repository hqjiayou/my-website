# 持久层真实 PostgreSQL 回归验证（`verify-pg`）：连接本地 PostgreSQL 临时库（默认库名 `my_website_3c_verify`），Flyway 迁移与 Mapper 联通性校验。
# 启用方式：根模块 Maven profile persistence-verify-pg（参见 docs/website-services/数据文档/持久层真实PostgreSQL验证说明.md）
spring:
  datasource:
    url: ${VERIFY_PG_URL:jdbc:postgresql://localhost:5432/my_website_3c_verify}
    # 与 docker-compose.yml 中 POSTGRES_* 默认值一致；可被 VERIFY_PG_* 或环境变量 POSTGRES_USER / POSTGRES_PASSWORD 覆盖。
    username: ${VERIFY_PG_USER:${POSTGRES_USER:hqjiayou}}
    password: ${VERIFY_PG_PASSWORD:${POSTGRES_PASSWORD:hqjiayou}}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

storage:
  minio:
    endpoint: http://127.0.0.1:19000
    access-key: test
    secret-key: test
    bucket: test
    secure: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 5C.1：RBAC 种子 Flyway 真实 PostgreSQL 验证。默认由 Testcontainers 自举一次性容器（专用库 my_website_rbac_verify）。
# 启用：本 profile + persistence-verify-pg。指向外部 PG：VERIFY_PG_RBAC_URL + VERIFY_PG_RBAC_DRIVER=org.postgresql.Driver + VERIFY_PG_RBAC_USER/PASSWORD。
spring:
  datasource:
    url: ${VERIFY_PG_RBAC_URL:jdbc:tc:postgresql:16-alpine:///my_website_rbac_verify}
    driver-class-name: ${VERIFY_PG_RBAC_DRIVER:org.testcontainers.jdbc.ContainerDatabaseDriver}
    username: ${VERIFY_PG_RBAC_USER:test}
    password: ${VERIFY_PG_RBAC_PASSWORD:test}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8083/.well-known/jwks.json}

storage:
  minio:
    endpoint: http://127.0.0.1:19000
    access-key: test
    secret-key: test
    bucket: test
    secure: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

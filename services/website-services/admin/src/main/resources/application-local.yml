spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/my_website_dev}
    username: ${DB_USERNAME:mywebsite}
    # 默认值与仓库 services/website-services/docker-compose.yml 中 Postgres（POSTGRES_*）对齐；自建库请用 DB_* 覆盖
    password: ${DB_PASSWORD:devpass}
  flyway:
    # 平台 DDL 仅此一处维护；变更请在 admin/src/main/resources/db/migration 追加脚本
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 仓库 docker-compose redis 默认无口令；按需设置 REDIS_PASSWORD
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:CHANGE_ME}
    secret-key: ${MINIO_SECRET_KEY:CHANGE_ME}
    bucket: ${MINIO_BUCKET:uploads}
    secure: ${MINIO_SECURE:false}

# 数据库 / Redis / MinIO / Admin JWT 等本地连接信息在 `.env`（范本 `.env.example`）中维护。
# PostgreSQL：优先维护 POSTGRES_*（与 Docker Compose 一致）；JDBC 默认值与之对齐。可选覆盖 DB_*。
# 未加载 `.env` 时仍可解析出合法 jdbc URL（见下方默认值）。

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:REPLACE_WITH_RANDOM_SECRET_AT_LEAST_32_BYTES_LONG}

spring:
  datasource:
    # DB_* 可选；未设置时与 Compose 的 POSTGRES_* 一致（同一 .env 只改一套口令即可）
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:my_website_dev}}
    username: ${DB_USERNAME:${POSTGRES_USER:mywebsite}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:CHANGE_ME}}
  flyway:
    # 平台 DDL 仅此一处维护；变更请在 infra/src/main/resources/db/migration 追加脚本（classpath:db/migration）
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:CHANGE_ME}
    secret-key: ${MINIO_SECRET_KEY:CHANGE_ME}
    bucket: ${MINIO_BUCKET:uploads}
    secure: ${MINIO_SECURE:false}

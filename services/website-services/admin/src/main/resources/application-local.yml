# 数据库 / MinIO 等本地连接信息在 `.env`（范本 `.env.example`）中维护。
# Admin 不使用 Redis（Refresh Session 在 auth）；已在 application.yml 排除 Redis 自动配置。
# Admin 验签：仅通过 AUTH_JWKS_URI 拉取 Auth 的 JWKS（不持有 JWT 签名密钥）。建议先启动 Auth 再启动 Admin。
# PostgreSQL：优先维护 POSTGRES_*（与 website-services/.env 及 local-stack Postgres 账号一致）。

spring:
  datasource:
    # DB_* 可选；未设置时回落到 POSTGRES_*（同一 website-services/.env 保持一套口令即可）
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:my_website_dev}}
    username: ${DB_USERNAME:${POSTGRES_USER:mywebsite}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:CHANGE_ME}}
  flyway:
    # 平台 DDL 仅此一处维护；变更请在 infra/src/main/resources/db/migration 追加脚本（classpath:db/migration）
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

mywebsite:
  ai:
    model-entry-secret: ${AI_MODEL_ENTRY_SECRET:local-dev-model-entry-secret}
  agent:
    business-api-base-url: ${AGENT_BUSINESS_API_BASE_URL:http://127.0.0.1:8082}
  proxy-services:
    management-key: ${PROXY_SERVICES_MANAGEMENT_KEY:}

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:CHANGE_ME}
    secret-key: ${MINIO_SECRET_KEY:CHANGE_ME}
    bucket: ${MINIO_BUCKET:uploads}
    secure: ${MINIO_SECURE:false}

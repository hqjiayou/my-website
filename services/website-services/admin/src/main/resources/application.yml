spring:
  application:
    name: admin-service
  profiles:
    default: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  messages:
    basename: i18n/common/messages,i18n/admin/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8083/.well-known/jwks.json}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

app:
  i18n:
    default-locale: ja-JP
    supported-locales:
      - ja-JP
      - zh-CN
      - en-US

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

server:
  port: 8081

admin:
  media:
    max-image-bytes: 5242880
    max-pdf-bytes: 20971520
    presign-ttl: 10m
    orphan-retention: 1h
    orphan-stale-upload: 1h
    orphan-batch-size: 50
    orphan-fixed-delay-ms: 900000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

security:
  jwt:
    issuer: my-website
    audience: ADMIN

spring:
  application:
    name: admin-service
  profiles:
    default: local

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

server:
  port: 8081

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

security:
  jwt:
    issuer: my-website
    audience: ADMIN
    secret: ${SECURITY_JWT_SECRET:}
    access-token-ttl: 15m
  auth:
    refresh-token-ttl: 7d
    refresh-cookie-name: admin_refresh_token
    refresh-cookie-path: /api/admin/auth
    refresh-cookie-secure: ${SECURITY_REFRESH_COOKIE_SECURE:true}
    refresh-cookie-same-site: Strict
    admin-login-max-password-length: 128

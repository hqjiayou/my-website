spring:
  application:
    name: admin-service
  profiles:
    default: local
  messages:
    basename: i18n/common/messages
    encoding: UTF-8
    fallback-to-system-locale: false

app:
  i18n:
    default-locale: ja-JP
    supported-locales:
      - ja-JP
      - zh-CN
      - en-US

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

server:
  port: 8081

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

security:
  jwt:
    issuer: my-website
    audience: ADMIN
    secret: ${SECURITY_JWT_SECRET:}
    access-token-ttl: 15m

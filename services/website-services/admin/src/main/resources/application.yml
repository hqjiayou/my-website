spring:
  application:
    name: admin-service
  profiles:
    default: local

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

server:
  port: 8081

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

security:
  jwt:
    issuer: my-website
    access-token-ttl: 30m
    refresh-token-ttl: 14d

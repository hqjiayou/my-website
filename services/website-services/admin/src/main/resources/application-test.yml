# 测试 Profile：内存 H2，不跑 Flyway；JWKS 由集成测试类 {@link com.mywebsite.admin.testsupport.AbstractAdminSpringBootTest} 动态注册。
security:
  jwt:
    issuer: test-issuer
    audience: ADMIN
    access-token-ttl: 15m

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:admin_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway:
    enabled: false
  messages:
    basename: i18n/common/messages,i18n/admin/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

app:
  i18n:
    default-locale: ja-JP
    supported-locales:
      - ja-JP
      - zh-CN
      - en-US

storage:
  minio:
    endpoint: http://127.0.0.1:19000
    access-key: test
    secret-key: test
    bucket: test
    secure: false

admin:
  media:
    max-image-bytes: 5242880
    max-pdf-bytes: 20971520
    presign-ttl: 10m
    orphan-retention: 0s
    orphan-stale-upload: 0s
    orphan-batch-size: 50
    orphan-fixed-delay-ms: 3600000

# 连接信息与密钥在仓库 `services/website-services/.env`（范本 `.env.example`）中维护。
# RS256：在 `.env` 中设置 AUTH_JWT_PRIVATE_KEY_PATH / AUTH_JWT_PUBLIC_KEY_PATH / AUTH_JWT_KEY_ID；以下为本地默认文件路径。
# 支持服务级变量 AUTH_*；数据库未设置时回退到 DB_* / POSTGRES_*。

mywebsite:
  auth:
    jwt:
      privateKeyPath: ${AUTH_JWT_PRIVATE_KEY_PATH:./secrets/local/auth-private.pem}
      publicKeyPath: ${AUTH_JWT_PUBLIC_KEY_PATH:./secrets/local/auth-public.pem}
      keyId: ${AUTH_JWT_KEY_ID:auth-local-rs256-key-1}
  # 绑定 TokenProperties，前缀 mywebsite.security.token。
  security:
    token:
      refresh-cookie-secure: ${SECURITY_REFRESH_COOKIE_SECURE:false}

spring:
  datasource:
    url: ${AUTH_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:my_website_dev}}}
    username: ${AUTH_DB_USERNAME:${DB_USERNAME:${POSTGRES_USER:mywebsite}}}
    password: ${AUTH_DB_PASSWORD:${DB_PASSWORD:${POSTGRES_PASSWORD:CHANGE_ME}}}
  flyway:
    enabled: false
  data:
    redis:
      host: ${AUTH_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${AUTH_REDIS_PORT:${REDIS_PORT:6379}}
      # local-stack 常见 Redis 未设 requirepass；空默认避免误用占位串 CHANGE_ME 连接失败。
      password: ${AUTH_REDIS_PASSWORD:${REDIS_PASSWORD:}}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

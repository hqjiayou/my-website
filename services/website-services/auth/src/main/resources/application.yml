spring:
  application:
    name: auth-service
  profiles:
    default: local
  messages:
    basename: i18n/common/messages,i18n/auth/messages
    encoding: UTF-8
    fallback-to-system-locale: false

mywebsite:
  security:
    token:
      access-token-expire-seconds: 900
      refresh-token-expire-seconds: 604800
      refresh-cookie-name: MYWEBSITE_REFRESH_TOKEN
      refresh-cookie-path: /api/auth/token/refresh
      refresh-cookie-secure: ${SECURITY_REFRESH_COOKIE_SECURE:true}
      refresh-cookie-http-only: true
      refresh-cookie-same-site: Lax

app:
  i18n:
    default-locale: ja-JP
    supported-locales:
      - ja-JP
      - zh-CN
      - en-US

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

server:
  port: ${AUTH_APP_PORT:8083}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:unused}
    secure: ${MINIO_SECURE:false}

security:
  jwt:
    issuer: my-website
    audience: ADMIN
    site-audience: SITE
  auth:
    admin-login-max-password-length: 128

function topNav(){const n={dashboard:'总览',agents:'智能体',agent:curr().name,'resource-model':'模型 API','resource-prompt':'Prompt 模板','resource-skills':'Skills','resource-mcp':'MCP 服务','resource-knowledge':'知识空间',usage:'AI 用量',logs:'执行日志',team:'成员与权限',system:'系统设置',architecture:'结构总览'};return `<header class="topbar"><div class="top-left"><button class="topbtn" title="折叠侧栏" data-action="collapse">${ic('sidebar')}</button><div class="top-breadcrumb"><span>管理后台</span>${ic('chevron','sm')}<strong>${h(n[st.route]||'概览')}</strong>${st.route==='agent'?`${ic('chevron','sm')}<span>${{overview:'概览',config:'配置',debug:'调试',history:'运行记录',settings:'设置'}[st.agentTab]}</span>`:''}</div></div><div class="top-right"><button class="top-search" data-action="globalSearch">${ic('search','sm')}<span>搜索智能体和资源…</span><kbd>⌘ K</kbd></button><div class="env"><span class="top-dot"></span>DEMO MODE</div><button class="topbtn" title="切换亮色 / 深色" data-action="theme">${ic(st.theme==='light'?'moon':'sun')}</button><button class="topbtn" title="通知" data-action="notify">${ic('bell')}</button><div class="profile">AD</div></div></header>`}
function stats(){return `<div class="stat-grid">${[['bot','智能体总数',String(agents.length),'2 个运行中'],['cpu','可用模型',String(resources.model.filter(x=>x.status==='healthy').length),'KEY / CLI 双模式'],['activity','近 7 天会话','275','演示统计'],['shield','服务健康度','98.6%','最近 24 小时']].map(([ico,t,n,note])=>`<div class="card stat"><div class="stat-top"><span>${t}</span><span class="stat-ico">${ic(ico,'sm')}</span></div><div class="stat-val">${n}</div><div class="stat-bottom">${note}</div></div>`).join('')}</div>`}
function dashboard(){return `${pageTitle('WORKSPACE / OVERVIEW','工作台总览','集中查看智能体配置、平台资源与运行状态。先处理需要关注的事项，再进入具体 Agent。',button(`${ic('plus','sm')} 创建智能体`,'createAgent','primary'))}${stats()}<div class="two-col"><div class="stack"><div class="card card-pad"><div class="card-head"><div><div class="card-title">最近使用的智能体</div><div class="card-desc">直接进入 Agent 工作台，而不是跳入技术配置菜单。</div></div><a class="card-link" data-action="nav" data-route="agents">查看全部 ${ic('chevron','sm')}</a></div><div class="itemlist">${agents.map(a=>`<div class="item"><div class="row"><span class="avatar-square">${ic('bot')}</span><div><div class="itemname">${h(a.name)}</div><div class="itemdesc">${h(a.desc)}</div></div></div><div class="row">${statusChip(a.status)}${iconBtn('chevron','openAgent:'+a.id,'进入工作区')}</div></div>`).join('')}</div></div><div class="card card-pad"><div class="card-head"><div><div class="card-title">当前运行链路</div><div class="card-desc">使用资源资产构建 Agent，无需复制或重建模型。</div></div></div><div class="callout">${ic('info','lg')}<div><strong style="color:var(--text)">配置模型的推荐流程</strong><div style="margin-top:4px">先在资源库注册模型 → 进入 Agent 的「配置 / 模型链」→ 选择并排序 → 保存 → 调试验证。</div></div></div><div class="health-strip" style="margin-top:19px"><div class="health-item"><div class="health-label">模型来源</div><div class="health-value">资源库</div></div><div class="health-item"><div class="health-label">资源选择</div><div class="health-value">统一抽屉</div></div><div class="health-item"><div class="health-label">配置范围</div><div class="health-value">当前 Agent</div></div><div class="health-item"><div class="health-label">验证方式</div><div class="health-value">调试工作台</div></div></div></div></div><div class="stack"><div class="card card-pad"><div class="card-head"><div><div class="card-title">需要关注</div><div class="card-desc">演示的健康检查摘要</div></div><span class="chip amber">2 项提示</span></div><div class="itemlist"><div class="item"><div class="row">${ic('alert')}<div><div class="itemname">1 个模型入口不可用</div><div class="itemdesc">Test Provider 已停用</div></div></div>${iconBtn('chevron','nav:resource-model','查看')}</div><div class="item"><div class="row">${ic('database')}<div><div class="itemname">知识库待索引</div><div class="itemdesc">FAQ 空间有 2 份待处理文件</div></div></div>${iconBtn('chevron','nav:resource-knowledge','查看')}</div></div></div><div class="card card-pad"><div class="card-head"><div class="card-title">最近活动</div><a class="card-link" data-action="nav" data-route="logs">所有日志 ${ic('chevron','sm')}</a></div>${[['21:48','通用智能助手','完成一次调试执行'],['20:17','文档研究助手','完成文档分析'],['昨日','开发执行助手','执行异常，需要排查']].map(([time,name,note],i)=>`<div class="activity-row"><span class="activity-dot" style="background:${i===2?'var(--amber)':'var(--primary)'}"></span><div><strong>${name}</strong><div class="desc">${note}</div></div><span class="date">${time}</span></div>`).join('')}</div><div class="card card-pad"><div class="card-head"><div class="card-title">结构说明</div>${ic('layers')}</div><p class="section-note">查看导航层级、全局资源与 Agent 自有配置的职责分界，以及共享组件结构。</p><button class="btn small" data-action="nav" data-route="architecture" style="margin-top:14px">查看完整结构 ${ic('chevron','sm')}</button></div></div></div>`}
function agentsPage(){let rows=agents.filter(a=>(a.name+' '+a.code+' '+a.desc).toLowerCase().includes(st.filter.toLowerCase())&&(st.filterStatus==='all'||a.status===st.filterStatus));return `${pageTitle('AGENTS / MANAGE','智能体','创建和管理智能体；模型、Skills、知识与工具的配置在每个 Agent 工作区完成。',button(`${ic('plus','sm')} 新建智能体`,'createAgent','primary'))}<div class="card"><div class="card-pad" style="padding-bottom:8px"><div class="toolbar"><label class="search-field">${ic('search','sm')}<input id="filterAgents" data-input="filterAgents" placeholder="搜索名称、标识或描述" value="${h(st.filter)}"/></label><select class="select" data-change="filterStatus"><option value="all" ${st.filterStatus==='all'?'selected':''}>全部状态</option><option value="active" ${st.filterStatus==='active'?'selected':''}>运行中</option><option value="paused" ${st.filterStatus==='paused'?'selected':''}>已停用</option></select></div></div><div class="table-wrap"><table class="table"><thead><tr><th>智能体</th><th>类型</th><th>模型链</th><th>关联资源</th><th>状态</th><th>最近修改</th><th></th></tr></thead><tbody>${rows.map(a=>`<tr class="clickable" data-action="openAgent:${a.id}"><td><div class="row"><span class="avatar-square">${ic('bot','sm')}</span><div><div class="primary-text">${h(a.name)}</div><div class="secondary-text">${h(a.code)}</div></div></div></td><td>${h(a.type)}</td><td class="muted">${chainOf(a).length} 个入口</td><td class="muted">${a.skills.length} Skills · ${a.knowledge.length} 知识空间</td><td>${statusChip(a.status)}</td><td class="muted">${h(a.updated)}</td><td>${ic('chevron','sm')}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">没有匹配的智能体</td></tr>'}</tbody></table></div><div style="border-top:1px solid var(--border);padding:13px 20px;color:var(--muted);font-size:11px">共 ${rows.length} 个智能体 · 点击整行进入工作区</div></div>`}
function agentShell(){let a=curr();let tabs=[['overview','概览'],['config','配置'],['debug','调试'],['history','运行记录'],['settings','设置']];return `<div class="agent-head"><div class="row" style="gap:14px"><div class="agent-icon">${ic('bot','xl')}</div><div><div class="row"><div class="agent-title">${h(a.name)}</div>${statusChip(a.status)}</div><div class="agent-meta">${h(a.code)} · ${h(a.type)} · 最近更新 ${h(a.updated)}</div></div></div><div class="head-actions"><button class="btn" data-action="nav" data-route="agents">${ic('left','sm')} 返回列表</button><button class="btn primary" data-action="agentTab" data-tab="debug">${ic('play','sm')} 运行测试</button></div></div><div class="agent-tabs"><div class="tabs">${tabs.map(([id,label])=>`<button class="tab ${st.agentTab===id?'active':''}" data-action="agentTab" data-tab="${id}">${label}</button>`).join('')}</div></div>${({overview:agentOverview,config:agentConfig,debug:agentDebug,history:agentHistory,settings:agentSettings}[st.agentTab])()}`}
function agentOverview(){let a=curr();let model=chainOf(a).map(id=>res('model',id)).filter(Boolean);return `<div class="card" style="margin-bottom:18px"><div class="health-strip"><div class="health-item"><div class="health-label">当前模式</div><div class="health-value">${h(a.mode)} 模型链</div><div class="health-note">可在配置中切换</div></div><div class="health-item"><div class="health-label">主用模型</div><div class="health-value">${h(model[0]?.model||'未配置')}</div><div class="health-note">${model.length-1} 个备用入口</div></div><div class="health-item"><div class="health-label">默认 Skills</div><div class="health-value">${a.skills.length} 项启用</div><div class="health-note">本轮可临时覆盖</div></div><div class="health-item"><div class="health-label">知识空间</div><div class="health-value">${a.knowledge.length} 个已关联</div><div class="health-note">共享资源可复用</div></div></div></div><div class="two-even" style="margin-bottom:17px"><div class="card card-pad"><div class="card-head"><div><div class="card-title">模型与回退链</div><div class="card-desc">当前 Agent 的调用优先级</div></div><a class="card-link" data-action="configTab:model">编辑 ${ic('chevron','sm')}</a></div><div class="model-flow">${model.map((x,i)=>`${i?`<span class="flow-arrow">${ic('chevron','sm')}</span>`:''}<div class="flow-node ${i===0?'main-node':''}"><div class="row" style="gap:6px"><b>${h(x.model||x.name)}</b></div><small>${i===0?'主用':'备用'} · ${h(x.meta)}</small></div>`).join('')||'<span class="muted xs">未配置</span>'}</div><p class="help" style="margin-top:16px">只编辑当前 Agent 的资源引用，不会修改平台密钥或模型本体。</p></div><div class="card card-pad"><div class="card-head"><div><div class="card-title">Prompt 与行为</div><div class="card-desc">当前生效的系统提示词摘要</div></div><a class="card-link" data-action="configTab:prompt">编辑 ${ic('chevron','sm')}</a></div><div class="row" style="margin-bottom:11px">${ic('prompt')}<strong class="xs">${h(res('prompt',a.promptId)?.name||'自定义 Prompt')}</strong><span class="chip blue">本地副本</span></div><p class="section-note" style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${h(a.prompt)}</p><hr class="separator"/><div class="row between"><span class="muted xs">编辑模板不影响已套用的 Agent</span>${ic('shield','sm')}</div></div></div><div class="two-even"><div class="card card-pad"><div class="card-head"><div><div class="card-title">知识与工具</div><div class="card-desc">已经关联到当前 Agent 的能力</div></div><a class="card-link" data-action="configTab:tools">管理 ${ic('chevron','sm')}</a></div><div class="itemlist"><div class="item"><div class="row">${ic('database')}<div><div class="itemname">知识空间</div><div class="itemdesc">${a.knowledge.map(id=>res('knowledge',id)?.name).filter(Boolean).join('、')||'未关联'}</div></div><span class="chip blue">${a.knowledge.length}</span></div><div class="item"><div class="row">${ic('sparkles')}<div><div class="itemname">Skills</div><div class="itemdesc">${a.skills.map(id=>res('skills',id)?.name).filter(Boolean).join('、')||'未启用'}</div></div><span class="chip blue">${a.skills.length}</span></div><div class="item"><div class="row">${ic('plug')}<div><div class="itemname">MCP 服务器</div><div class="itemdesc">${a.mcpMode==='off'?'当前关闭':a.mcpMode==='inherit'?'继承全局':a.mcp.map(id=>res('mcp',id)?.name).filter(Boolean).join('、')||'未选'}</div></div><span class="chip blue">${a.mcp.length}</span></div></div></div><div class="card card-pad"><div class="card-head"><div><div class="card-title">执行与健康</div><div class="card-desc">快速判断是否具备运行条件</div></div><a class="card-link" data-action="agentTab" data-tab="history">查看运行记录 ${ic('chevron','sm')}</a></div>${[['check','模型链已有主用入口',!!model.length],['check','Prompt 已配置',!!a.prompt],['check','知识空间已关联',!!a.knowledge.length],['check','执行日志可追踪',true]].map(([ico,t,ok])=>`<div class="checkline">${ic(ok?'check':'alert','sm')}<span>${t}</span>${ok?'<span class="chip green" style="margin-left:auto">就绪</span>':'<span class="chip amber" style="margin-left:auto">待处理</span>'}</div>`).join('')}<hr class="separator"/>${button(`${ic('play','sm')} 进入调试工作台`,'agentTab:debug','primary')}</div></div>`}
function configNav(){let tabs=[['model','模型链','cpu'],['prompt','Prompt','prompt'],['knowledge','知识空间','database'],['tools','Skills / MCP','plug']];return `<aside class="card config-nav">${tabs.map(([id,label,ico])=>`<button class="config-nav-item ${st.configTab===id?'active':''}" data-action="configTab" data-tab="${id}">${ic(ico,'sm')} ${label}</button>`).join('')}</aside>`}
function agentConfig(){return `<div class="config-layout">${configNav()}<div class="config-detail">${({model:configModels,prompt:configPrompt,knowledge:configKnowledge,tools:configTools}[st.configTab])()}</div></div>`}
function configModels(){let a=curr(),chain=chainOf(a).map(id=>res('model',id)).filter(Boolean);let other=resources.model.filter(x=>!chainOf(a).includes(x.id)&&(a.mode==='CLI'?x.meta==='CLI Proxy':x.meta!=='CLI Proxy'));return `<div class="section-line"><div><h2>模型与回退链</h2><p>模型注册在平台资源库；这里仅配置当前 Agent 的调用顺序。</p></div>${button(`${ic('plus','sm')} 添加模型`,'picker:model','primary')}</div><div class="callout" style="margin-bottom:16px">${ic('info','sm')}<span>第一个模型为主用，后续为备用。优先级按顺序执行；已停用资源不能新增。切换模式不应修改其他 Agent 的平台默认项。</span></div><div class="card card-pad" style="margin-bottom:16px"><div class="card-head"><div><div class="card-title">当前模型链</div><div class="card-desc">调整顺序或移除已绑定资源</div></div><span class="chip blue">${chain.length} 个入口</span></div><div class="row between" style="margin-bottom:18px"><div><div class="label" style="margin-bottom:4px">运行模式</div><div class="help">选择本 Agent 的默认模式</div></div><div class="seg">${[['KEY','API Key'],['CLI','CLI Proxy']].map(([id,label])=>`<button class="${a.mode===id?'active':''}" data-action="agentMode:${id}">${label}</button>`).join('')}</div></div>${chain.map((m,i)=>`<div class="resource-row"><div class="rmain"><span class="num">${i+1}</span><span class="stat-ico" style="width:33px;height:33px">${ic('cpu','sm')}</span><div style="min-width:0"><div class="rtitle">${h(m.name)} ${i===0?'<span class="chip blue" style="margin-left:5px">主用</span>':''}</div><div class="rdesc">${h(m.detail)} · ${h(m.origin)}</div></div></div><div class="ract">${statusChip(m.status)}${iconBtn('up',`moveModel:${i}:-1`,'上移')}${iconBtn('arrowDown',`moveModel:${i}:1`,'下移')}${iconBtn('trash',`remove:model:${m.id}`,'移除','negative')}</div></div>`).join('')||'<div class="empty">暂无模型，请从平台资源库添加。</div>'}<div class="row between" style="margin-top:16px"><span class="muted mini">以上更改属于 Agent 配置，不会改变平台资源本身。</span>${button(`${ic('save','sm')} 保存模型链`,'saveConfig','primary')}</div></div><div class="card card-pad"><div class="card-head"><div><div class="card-title">平台模型目录</div><div class="card-desc">目前还有 ${other.length} 个未关联的模型</div></div><a class="card-link" data-action="nav" data-route="resource-model">管理模型 API ${ic('chevron','sm')}</a></div><div class="itemlist">${other.slice(0,3).map(m=>`<div class="item"><div class="row">${ic('cpu','sm')}<div><div class="itemname">${h(m.name)}</div><div class="itemdesc">${h(m.meta)} · ${h(m.origin)}</div></div></div>${statusChip(m.status)}</div>`).join('')}</div></div>`}
function configPrompt(){let a=curr();return `<div class="section-line"><div><h2>Prompt 与智能体行为</h2><p>编辑本地 Prompt，或从平台模板复制内容后独立调整。</p></div>${button(`${ic('plus','sm')} 从模板插入`,'picker:prompt')}</div><div class="two-col" style="grid-template-columns:minmax(0,1.9fr) minmax(220px,.8fr)"><div class="card card-pad"><div class="card-head"><div><div class="card-title">系统提示词</div><div class="card-desc">当前 Agent 自有副本 · 支持独立修改</div></div><span class="chip green">已配置</span></div><div class="form-row"><label class="label" for="promptText">System Prompt</label><textarea class="field area" id="promptText" data-input="promptText" maxlength="8000" style="height:270px">${h(a.prompt)}</textarea><div class="row between"><span class="help">请描述角色、行为、边界和输出要求。</span><span class="help" id="promptLength">${a.prompt.length} / 8000</span></div></div><hr class="separator"/><div class="row between"><span class="muted mini">模板套用后不与模板保持自动同步。</span>${button(`${ic('save','sm')} 保存 Prompt`,'saveConfig','primary')}</div></div><div class="stack"><div class="card card-pad"><div class="card-head"><div class="card-title">当前来源</div>${ic('prompt','sm')}</div><div class="primary-text">${h(res('prompt',a.promptId)?.name||'自定义')}</div><p class="section-note" style="margin-top:8px">只保留来源记录，不会将模板后续修改覆盖到当前 Agent。</p><button class="btn small" style="margin-top:15px" data-action="picker:prompt">更换模板</button></div><div class="card card-pad"><div class="card-head"><div class="card-title">编写建议</div>${ic('info','sm')}</div><div class="stack" style="gap:10px"><div class="checkline">${ic('check','sm')} 角色和目标明确</div><div class="checkline">${ic('check','sm')} 与可用工具一致</div><div class="checkline">${ic('check','sm')} 禁止不确定的事实断言</div><div class="checkline">${ic('check','sm')} 输出结构稳定</div></div></div></div></div>`}
function configKnowledge(){let a=curr();return `<div class="section-line"><div><h2>知识空间</h2><p>订阅平台知识空间，而不是把文档复制进 Agent。</p></div>${button(`${ic('plus','sm')} 关联知识空间`,'picker:knowledge','primary')}</div><div class="two-col"><div class="card card-pad"><div class="card-head"><div><div class="card-title">已关联空间</div><div class="card-desc">共 ${a.knowledge.length} 个空间，默认供知识检索调用</div></div></div>${a.knowledge.map(id=>{let r=res('knowledge',id);return r?`<div class="resource-row"><div class="rmain"><span class="stat-ico">${ic('database','sm')}</span><div><div class="rtitle">${h(r.name)}</div><div class="rdesc">${h(r.detail)}</div></div></div><div class="ract">${statusChip(r.status)}${iconBtn('trash',`remove:knowledge:${id}`,'取消关联','negative')}</div></div>`:''}).join('')||'<div class="empty">暂无关联的知识空间</div>'}<div class="row between" style="margin-top:15px"><span class="muted mini">数据来自平台知识空间，只保留关联关系。</span>${button(`${ic('save','sm')} 保存关联`,'saveConfig','primary')}</div></div><div class="stack"><div class="card card-pad"><div class="card-head"><div class="card-title">知识检索状态</div>${ic('activity','sm')}</div><div class="row between"><div class="primary-text">文档索引</div><span class="chip green">可用</span></div><div class="progress" style="margin:12px 0 6px"><span style="width:94%"></span></div><div class="help">模拟索引状态：94% 已就绪</div></div><div class="card card-pad"><div class="card-title">管理边界</div><p class="section-note" style="margin:12px 0">平台统一维护文档上传、索引、重建和共享权限。Agent 仅决定订阅哪些空间。</p><button class="btn small" data-action="nav" data-route="resource-knowledge">前往平台知识空间 ${ic('chevron','sm')}</button></div></div></div>`}
function configTools(){let a=curr();let mcpModes=[['inherit','继承平台默认','无需为 Agent 逐项维护'],['off','全部关闭','本 Agent 不调用 MCP'],['custom','自定义选择','只启用明确勾选的服务']];return `<div class="section-line"><div><h2>Skills 与 MCP 工具</h2><p>默认能力由 Agent 配置决定；调试时可以临时覆盖当前轮 Skills。</p></div></div><div class="two-even"><div class="card card-pad"><div class="card-head"><div><div class="card-title">默认 Skills</div><div class="card-desc">已选择 ${a.skills.length} 项</div></div>${button(`${ic('plus','sm')} 选择 Skill`,'picker:skills','small')}</div>${a.skills.map(id=>{let r=res('skills',id);return r?`<div class="resource-row"><div class="rmain">${ic('sparkles','sm')}<div><div class="rtitle">${h(r.name)}</div><div class="rdesc">${h(r.detail)}</div></div></div>${iconBtn('trash',`remove:skills:${id}`,'移除','negative')}</div>`:''}).join('')||'<div class="empty">尚未配置默认 Skills</div>'}<p class="help">这里配置的是 Agent 默认 Skill；调试页的临时选择不会自动更改此处。</p></div><div class="card card-pad"><div class="card-head"><div><div class="card-title">MCP 服务选择</div><div class="card-desc">已定义本 Agent 可调用的外部工具</div></div>${button(`${ic('plus','sm')} 选择 MCP`,'picker:mcp','small')}</div>${mcpModes.map(([id,title,desc])=>`<label class="resource-row" style="cursor:pointer;padding:10px 13px;${a.mcpMode===id?'border-color:#9daaf4;background:var(--primary-soft)':''}"><div class="row"><input type="radio" name="mcpMode" data-change="mcpMode" value="${id}" ${a.mcpMode===id?'checked':''} /><div><div class="rtitle">${title}</div><div class="rdesc">${desc}</div></div></div></label>`).join('')}${a.mcpMode==='custom'?`<div class="itemlist">${a.mcp.map(id=>{let r=res('mcp',id);return r?`<div class="item"><div class="row">${ic('plug','sm')}<span class="xs semi">${h(r.name)}</span></div><div class="row">${statusChip(r.status)}${iconBtn('trash',`remove:mcp:${id}`,'移除','negative')}</div></div>`:''}).join('')||'<div class="help">还没有选择 MCP 服务</div>'}</div>`:''}<p class="help">保存后请在调试页确认实际生效的工具集合。</p></div></div><div class="row between" style="margin-top:16px"><div class="callout" style="max-width:640px">${ic('info','sm')}<span>平台已停用的资源不会被允许新增。请区分「已选」「可用」「实际生效」三个状态。</span></div>${button(`${ic('save','sm')} 保存工具配置`,'saveConfig','primary')}</div>`}
function agentDebug(){let a=curr();let mod=res('model',chainOf(a)[0]);return `<div class="page-head" style="margin-bottom:16px"><div><h1 style="font-size:19px">调试工作台</h1><p>验证当前 Agent 的模型、Prompt 与工具调用；执行详情按需展开。</p></div><div class="head-actions"><span class="chip blue">${h(mod?.model||'未配置模型')}</span><span class="chip grey">${a.skills.length} Skills</span><button class="btn" data-action="inspector">${ic('activity','sm')} ${st.inspector?'关闭':'查看'}执行详情</button></div></div><div class="chat-layout ${st.inspector?'open':''}"><div class="card chat-card"><div class="chat-top"><div class="row">${ic('message','sm')}<span class="semi xs">调试会话</span><span class="chip green">Preview</span></div><button class="btn small" data-action="clearChat">${ic('refresh','sm')} 新建会话</button></div><div class="chat-body" id="chatBody">${st.chats.map(c=>`<div class="bubble-wrap ${c.role==='user'?'user':''}"><div class="bubble-meta">${c.role==='user'?'你':'Agent · 模拟响应'}</div><div class="bubble">${h(c.text)}</div></div>`).join('')}</div><div class="chat-compose"><div class="compose-box"><textarea id="chatInput" rows="1" placeholder="输入测试消息… Enter 发送 / Shift+Enter 换行">${h(st.chatInput)}</textarea><button class="btn primary" title="发送模拟消息" data-action="sendChat">${ic('send','sm')}</button></div><div class="row between" style="margin-top:9px"><span class="muted mini">本原型不调用真实 AI API，发送会显示模拟结果。</span><span class="muted mini">${a.mode} · 模拟执行</span></div></div></div>${st.inspector?`<aside class="card card-pad inspector"><div class="card-head"><div><div class="card-title">执行检查器</div><div class="card-desc">本轮调用和生效配置</div></div>${iconBtn('x','inspector','关闭')}</div><div class="inspect-block"><h4>执行轨迹</h4><div class="timeline"><div class="timeline-item"><strong>模型入口解析</strong><p>${h(mod?.model||'未配置')} · ${h(a.mode)}</p></div><div class="timeline-item"><strong>加载系统 Prompt</strong><p>${a.prompt.length} 字符</p></div><div class="timeline-item"><strong>加载 Skills</strong><p>${a.skills.length} 项默认 Skill</p></div><div class="timeline-item"><strong>检索 & 工具</strong><p>${a.knowledge.length} 个知识空间 · ${a.mcpMode==='off'?0:a.mcp.length} 个 MCP</p></div><div class="timeline-item"><strong>流式响应</strong><p>模拟成功（无真实 API 请求）</p></div></div></div><div class="inspect-block"><h4>本轮模型</h4><div class="resource-row"><div class="rmain">${ic('cpu','sm')}<div><div class="rtitle">${h(mod?.model||'未配置')}</div><div class="rdesc">${h(mod?.meta||'')}</div></div></div></div></div><div class="inspect-block"><h4>生效 Skills</h4>${a.skills.map(id=>`<div class="row between" style="margin:8px 0;font-size:11px"><span>${h(res('skills',id)?.name||id)}</span>${ic('check','sm')}</div>`).join('')||'<p class="help">未启用</p>'}</div><div class="inspect-block"><h4>运行用量</h4><div class="row between"><span class="muted xs">输入 Token</span><b class="xs">—</b></div><div class="row between" style="margin-top:9px"><span class="muted xs">输出 Token</span><b class="xs">—</b></div><div class="help">演示模式无实时计费数据</div></div></aside>`:''}</div>`}
function agentHistory(){return `<div class="section-line"><div><h2>运行记录</h2><p>按执行批次查看真实产品应提供的模型、工具轨迹与异常诊断。</p></div>${button(`${ic('filter','sm')} 筛选记录`,'notify')}</div><div class="two-col" style="grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr)"><div class="card table-wrap"><table class="table"><thead><tr><th>执行时间</th><th>会话摘要</th><th>模型</th><th>结果</th></tr></thead><tbody>${histories.map(x=>`<tr class="clickable" data-action="inspectRun:${x.id}" style="${st.inspectId===x.id?'background:var(--primary-soft)':''}"><td class="muted">${x.time}</td><td><div class="primary-text">${h(x.question)}</div><div class="secondary-text">${h(x.id)} · ${h(x.agent)}</div></td><td class="muted">${h(x.model)}</td><td>${x.status==='成功'?'<span class="chip green">成功</span>':'<span class="chip red">失败</span>'}</td></tr>`).join('')}</tbody></table></div><div class="card card-pad">${(()=>{let x=histories.find(v=>v.id===st.inspectId)||histories[0];return `<div class="card-head"><div><div class="card-title">运行详情</div><div class="card-desc">${x.id}</div></div>${x.status==='成功'?'<span class="chip green">执行成功</span>':'<span class="chip red">执行失败</span>'}</div><div class="itemlist">${[['执行时间',x.time],['Agent',x.agent],['使用模型',x.model],['Token 用量',x.tokens],['执行耗时',x.duration]].map(([k,v])=>`<div class="item"><span class="xs muted">${k}</span><strong class="xs">${h(v)}</strong></div>`).join('')}</div><div class="callout" style="margin-top:20px">${ic('info','sm')}<span>正式实现应在此显示请求 ID、模型切换、工具调用、检索来源以及标准化错误码，支持追踪完整执行链。</span></div>`})()}</div></div>`}
function agentSettings(){let a=curr();return `<div class="section-line"><div><h2>智能体设置</h2><p>基础信息和生命周期管理。危险操作与日常配置分开。</p></div></div><div class="two-col"><div class="card card-pad"><div class="card-head"><div class="card-title">基本信息</div>${ic('settings','sm')}</div><div class="form-grid"><div class="form-row"><label class="label" for="agentName">智能体名称</label><input id="agentName" class="field" data-input="agentName" value="${h(a.name)}" /></div><div class="form-row"><label class="label">标识（只读）</label><input class="field" disabled value="${h(a.code)}" /></div></div><div class="form-row"><label class="label" for="agentDesc">用途说明</label><textarea id="agentDesc" class="field" data-input="agentDesc" style="min-height:110px;resize:vertical">${h(a.desc)}</textarea></div><div class="row between"><span class="help">名称和说明仅影响当前 Agent。</span>${button(`${ic('save','sm')} 保存基本信息`,'saveBasics','primary')}</div></div><div class="stack"><div class="card card-pad"><div class="card-head"><div class="card-title">运行状态</div>${statusChip(a.status)}</div><p class="section-note">停用后应禁止正式会话调用，但保留资源配置与历史日志。</p><button class="btn" data-action="toggleAgent" style="margin-top:14px">${a.status==='active'?'停用此智能体':'重新启用'}</button></div><div class="card card-pad"><div class="card-head"><div class="card-title">危险操作</div>${ic('alert','sm')}</div><p class="section-note">删除操作将从智能体列表移除当前条目。此处为演示，无后端数据变更。</p><button class="btn danger" data-action="confirmDelete" style="margin-top:13px">${ic('trash','sm')} 删除智能体</button></div></div></div>`}
function resourcePage(type){let d=resourceDefs[type],list=resources[type].filter(r=>(r.name+' '+r.detail+' '+r.origin).toLowerCase().includes(st.filter.toLowerCase())&&(st.filterStatus==='all'||r.status===st.filterStatus));return `${pageTitle('PLATFORM / RESOURCE LIBRARY',d.title,d.desc,button(`${ic('plus','sm')} 新建${d.singular}`,'createResource:'+type,'primary'))}<div class="card"><div class="card-pad" style="padding-bottom:8px"><div class="toolbar"><label class="search-field">${ic('search','sm')}<input id="filterResources" data-input="filterResources" placeholder="按名称、来源或功能搜索" value="${h(st.filter)}" /></label><select class="select" data-change="filterStatus"><option value="all" ${st.filterStatus==='all'?'selected':''}>全部状态</option><option value="healthy" ${st.filterStatus==='healthy'?'selected':''}>可用</option><option value="disabled" ${st.filterStatus==='disabled'?'selected':''}>不可用</option><option value="warning" ${st.filterStatus==='warning'?'selected':''}>待处理</option></select></div></div><div class="table-wrap"><table class="table"><thead><tr><th>资源名称</th><th>说明</th><th>来源</th><th>分类 / 协议</th><th>状态</th><th>操作</th></tr></thead><tbody>${list.map(r=>`<tr><td><div class="row"><span class="avatar-square">${ic(d.icon,'sm')}</span><div class="primary-text">${h(r.name)}</div></div></td><td class="muted">${h(r.detail)}</td><td class="muted">${h(r.origin)}</td><td><span class="chip grey">${h(r.meta)}</span></td><td>${statusChip(r.status)}</td><td><button class="btn small" data-action="resourceDetail:${type}:${r.id}">查看详情 ${ic('chevron','sm')}</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">没有找到符合条件的资源</td></tr>'}</tbody></table></div><div style="padding:13px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)">共 ${list.length} 项资源 · 资源配置在平台统一维护，Agent 引用而不复制</div></div><div class="callout" style="margin-top:17px">${ic('info','sm')}<span>设计原则：模型 API、Skills、MCP 与知识空间有各自的资源管理页。Agent 内只保存引用关系、使用顺序和必要的本地配置。Prompt 模板采用「拷贝后独立编辑」的模式。</span></div>`}
function usage(){let days=['周一','周二','周三','周四','周五','周六','周日'],v=[35,57,49,76,61,94,68];return `${pageTitle('OBSERVABILITY / USAGE','AI 用量','跨 Agent 统一查看调用、Token 用量与成本趋势。以下为演示统计数据。',button(`${ic('refresh','sm')} 刷新数据`,'refresh'))}${stats()}<div class="two-col"><div class="card card-pad"><div class="card-head"><div><div class="card-title">最近 7 天调用趋势</div><div class="card-desc">示意数据 · 请求数量相对变化</div></div><span class="chip blue">本周</span></div><div class="kpi-bar">${days.map((d,i)=>`<div class="bar-group"><div class="bar ${i===5?'special':''}" style="height:${v[i]}%"></div><label>${d}</label></div>`).join('')}</div></div><div class="card card-pad"><div class="card-head"><div class="card-title">用量归属</div>${ic('chart')}</div>${[['通用智能助手',64],['文档研究助手',25],['开发执行助手',11]].map(([name,n])=>`<div style="margin-top:24px"><div class="row between"><b class="xs">${name}</b><span class="muted xs">${n}%</span></div><div class="usage-progress"><span style="width:${n}%"></span></div></div>`).join('')}<div class="help" style="margin-top:26px">正式版本建议将模型调用、Agent、用户、成本与错误按同一 Trace ID 关联。</div></div></div>`}

function architecture(){const arr=[{title:'01 · 全局工作空间',nodes:[['总览','健康、活动、快捷入口'],['智能体','列表、创建、筛选'],['Agent 工作区','概览 / 配置 / 调试 / 记录 / 设置']]},{title:'02 · 平台资源库',nodes:[['模型 API','供应商、CLI 代理、密钥'],['Prompt 模板','集中维护与复制'],['Skills','目录、版本、可用性'],['MCP','注册、测试、状态'],['知识空间','文档、索引、共享']]},{title:'03 · 监控中心',nodes:[['AI 用量','Token、调用趋势、成本'],['执行日志','Trace、错误、工具轨迹'],['诊断','模型切换、失效原因']]},{title:'04 · 系统管理',nodes:[['成员与权限','用户、角色、RBAC'],['系统设置','平台规则和偏好'],['审计与安全','集中管理高风险变更']]}];return `${pageTitle('DESIGN BLUEPRINT / SITEMAP','信息架构与职责边界','本页面既是原型导航地图，也是后续拆分组件与划分 API 责任的依据。',button(`${ic('copy','sm')} 复制结构摘要`,'copyArchitecture'))}<div class="arch-title"><h3>产品组织方式：平台负责「资源」，Agent 负责「组合」，调试负责「验证」</h3><p>避免按照后端数据表或数据库字段拆分一整排菜单。</p></div><div class="arch-tree" style="margin-bottom:21px">${arr.map(x=>`<div class="arch-col"><h3>${x.title}</h3>${x.nodes.map(([n,d])=>`<div class="arch-node"><b>${n}</b>${d}</div>`).join('')}</div>`).join('')}</div><div class="section-line"><div><h2>单个 Agent 内部</h2><p>保持五个主任务入口，配置内再按能力聚合。</p></div></div><div class="card" style="padding:17px;margin-bottom:21px"><div class="row" style="flex-wrap:wrap;justify-content:center;gap:10px">${[['概览','查看是否就绪'],['配置','模型 / Prompt / 知识 / 工具'],['调试','聊天 + 可选检查器'],['运行记录','追踪与排障'],['设置','基础信息与生命周期']].map(([a,b],i)=>`${i?`<span class="flow-arrow">${ic('chevron','sm')}</span>`:''}<div class="flow-node ${i===1?'main-node':''}"><b>${a}</b><small>${b}</small></div>`).join('')}</div></div><div class="section-line"><div><h2>共享组件层</h2><p>先解决交互一致性，再统一页面视觉。</p></div></div><div class="rule-grid">${[['box','ResourcePickerDrawer','模型、Skills、MCP、知识空间共用同一种资源搜索、选择和添加体验。'],['layers','AgentLayout / PageShell','全局侧栏、Agent 导航、标题、工具栏由共享布局承载，避免层层套侧栏。'],['shield','ConfigurationBoundary','严格区分平台资源修改与 Agent 自有配置修改，提供变更范围提示。'],['activity','ExecutionInspector','通过统一的 Trace 数据展示模型、工具、检索、错误和用量。'],['prompt','Form Controls','按钮、输入框、抽屉、确认弹窗的尺寸、层级和状态保持一致。'],['check','E2E Acceptance','覆盖模型链添加排序、Skills 选择、MCP 生效、调试与异常路径。']].map(([ico,n,d])=>`<div class="rule">${ic(ico,'lg')}<h3>${n}</h3><p>${d}</p></div>`).join('')}</div>`}
function contentPage(){if(st.route==='dashboard')return dashboard();if(st.route==='agents')return agentsPage();if(st.route==='agent')return agentShell();if(st.route.startsWith('resource-'))return resourcePage(st.route.slice(9));return ({usage,logs,team,system,architecture}[st.route]||dashboard)()}
function pickerModal(){if(!st.picker)return '';let t=st.picker.type,d=resourceDefs[t],a=curr(),selected=new Set(st.pickerSelection),taken=new Set(t==='model'?chainOf(a):t==='skills'?a.skills:t==='mcp'?a.mcp:t==='knowledge'?a.knowledge:[]);let rlist=resources[t].filter(r=>!taken.has(r.id)&&(t!=='model'||(a.mode==='CLI'?r.meta==='CLI Proxy':r.meta!=='CLI Proxy'))&&(r.name+' '+r.detail+' '+r.origin).toLowerCase().includes(st.pickerSearch.toLowerCase()));return `<div class="backdrop" data-action="closeOverlay"><div class="drawer"><div class="drawer-head"><div><h2>选择${d.singular}</h2><p>从平台资源库添加到「${h(a.name)}」</p></div>${iconBtn('x','closeOverlay','关闭')}</div><div class="drawer-body"><div class="callout" style="margin-bottom:16px">${ic('info','sm')}<span>此操作仅修改当前 Agent 的资源关联，不会修改平台资源的密钥、定义或启停状态。</span></div><label class="search-field" style="width:100%;max-width:none;margin-bottom:12px">${ic('search','sm')}<input id="pickerSearch" data-input="pickerSearch" placeholder="搜索名称、来源、描述" value="${h(st.pickerSearch)}" /></label><div class="row between" style="margin:13px 0 9px"><span class="label" style="margin:0">可选资源 · ${rlist.length}</span><span class="muted mini">停用资源不可选择</span></div>${rlist.map(r=>`<div class="picker-item ${selected.has(r.id)?'selected':''}" data-action="pickerToggle:${r.id}"><span class="fake-checkbox">${selected.has(r.id)?ic('check','sm'):''}</span><span class="stat-ico" style="width:34px;height:34px">${ic(d.icon,'sm')}</span><div style="flex:1;min-width:0"><div class="primary-text">${h(r.name)}</div><div class="secondary-text">${h(r.detail)}</div><div style="margin-top:6px" class="row"><span class="chip grey">${h(r.meta)}</span><span class="mini muted">${h(r.origin)}</span></div></div>${statusChip(r.status)}</div>`).join('')||'<div class="empty">没有可添加的资源。可前往平台资源库创建或检查已有关联。</div>'}</div><div class="drawer-foot"><span class="muted xs">已选择 ${selected.size} 项</span><div class="head-actions">${button('取消','closeOverlay')}${button(`${ic('plus','sm')} 确认添加`,'pickerCommit','primary')}</div></div></div></div>`}
function genericDialog(){if(!st.modal)return '';let m=st.modal;let isDelete=m.type==='deleteAgent';let title=m.type==='createAgent'?'新建智能体':m.type==='createResource'?`新建${resourceDefs[m.resType].singular}`:m.type==='resourceDetail'?'资源详情':'确认删除智能体';let note=m.type==='createAgent'?'创建一个可独立配置的 Agent。此操作仅修改浏览器内的演示数据。':m.type==='createResource'?'在平台资源库创建演示条目；真实版本应由对应资源 API 负责。':m.type==='resourceDetail'?'平台资源详情（演示数据）。':'删除后将从当前演示列表移除，无法恢复。';let r=m.type==='resourceDetail'?res(m.resType,m.id):null;return `<div class="dialog-backdrop" data-action="closeOverlay"><div class="dialog"><div class="row between" style="margin-bottom:12px"><h2>${h(title)}</h2>${iconBtn('x','closeOverlay','关闭')}</div><p>${h(note)}</p>${r?`<div class="resource-row" style="margin-top:18px"><div class="rmain">${ic(resourceDefs[m.resType].icon)}<div><strong>${h(r.name)}</strong><div class="help">${h(r.detail)} · ${h(r.origin)}</div></div></div>${statusChip(r.status)}</div>`:`${!isDelete?`<div class="form-row" style="margin-top:23px"><label class="label">${m.type==='createAgent'?'智能体名称':'资源名称'}</label><input id="modalInput" class="field" value="${h(st.modalInput)}" placeholder="请输入名称" /></div>`:''}`}${isDelete?`<div class="callout" style="margin-top:18px;background:var(--red-soft);border-color:#f3ccd1">${ic('alert','sm')}<span>将删除「${h(curr().name)}」及其演示配置。</span></div>`:''}<div class="row" style="justify-content:flex-end;margin-top:23px">${button('取消','closeOverlay')}${r?'':button(isDelete?`${ic('trash','sm')} 确认删除`:`${ic('check','sm')} 确认`,m.type==='createAgent'?'submitAgent':m.type==='createResource'?'submitResource':'deleteAgent',isDelete?'danger':'primary')}</div></div></div>`}
function render(){document.body.dataset.theme=st.theme;document.getElementById('root').innerHTML=`<div class="app">${st.mobileSidebarOpen?'<div class="mobile-overlay" data-action="closeMobile"></div>':''}${sNav()}<div class="main ${st.sidebarCollapsed?'wide':''}">${topNav()}<main class="content">${contentPage()}</main></div></div>${pickerModal()}${genericDialog()}`;if(st.route==='agent'&&st.agentTab==='debug'){let el=document.getElementById('chatBody');if(el)el.scrollTop=el.scrollHeight}}
function preserveRender(inputId){let el=document.activeElement,was=el?.id===inputId,pos=was&&el?.selectionStart!==null?el.selectionStart:null;render();if(was){let next=document.getElementById(inputId);if(next){next.focus();if(pos!==null&&next.setSelectionRange)next.setSelectionRange(pos,pos)}}}
function toast(message){let host=document.getElementById('toastHost'),el=document.createElement('div');el.className='toast';el.innerHTML=ic('check','sm')+'<span>'+h(message)+'</span>';host.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .25s';setTimeout(()=>el.remove(),300)},3000)}
function navigate(route){st.mobileSidebarOpen=false;st.route=route;st.filter='';st.filterStatus='all';window.scrollTo({top:0,behavior:'instant'});render()}
function openAgent(id){st.agentId=id;st.agentTab='overview';st.configTab='model';st.route='agent';st.inspector=false;navigate('agent')}
function openPicker(type){st.picker={type};st.pickerSearch='';st.pickerSelection=[];render()}
function closeOverlay(){st.picker=null;st.modal=null;st.modalInput='';render()}
function removeAsset(type,id){let a=curr(),key=type;if(type==='model'){a.chains[a.mode]=chainOf(a).filter(x=>x!==id)}else{a[key]=a[key].filter(x=>x!==id)}render();toast('已从当前 Agent 移除（未调用后端）')}
function pickerCommit(){let type=st.picker.type,a=curr(),sel=st.pickerSelection,available=sel.filter(id=>res(type,id)?.status==='healthy'||res(type,id)?.status==='warning');if(type==='prompt'){let item=res('prompt',available[0]);if(item){a.promptId=item.id;a.prompt=({p1:'你是一个可靠的智能助手。请准确理解用户意图，优先提供清晰、简洁且可以验证的回答。',p2:'请仔细分析用户文档，形成有证据的摘要、对比和关键结论，并列出引用来源。',p3:'请先确认任务目标，提出清晰步骤，再逐步执行和总结结果。'})[item.id]||item.detail;st.configTab='prompt'}}else{let target=type==='model'?chainOf(a):a[type];for(let id of available){if(!target.includes(id))target.push(id)}if(type==='mcp')a.mcpMode='custom'}closeOverlay();toast(available.length?`已添加 ${available.length} 项资源到当前 Agent`:'请选择可用资源')}
function moveModel(i,d){let a=curr(),chain=chainOf(a),t=i+d;if(t<0||t>=chain.length)return;[chain[i],chain[t]]=[chain[t],chain[i]];render();toast('模型链顺序已调整（演示状态）')}
function addAgent(){let name=st.modalInput.trim();if(!name){toast('请输入智能体名称');return}let id='a'+(agentSeq++);agents.unshift({id,name,code:'demo-'+id,desc:'新创建的演示智能体，可从配置页添加模型和工具。',status:'paused',type:'通用型',updated:'刚刚',mode:'KEY',models:[],chains:{KEY:[],CLI:[]},prompt:'',promptId:null,skills:[],mcp:[],mcpMode:'off',knowledge:[],conversations:0});st.modal=null;st.modalInput='';openAgent(id);toast('演示智能体创建成功')}
function addResource(){let name=st.modalInput.trim();if(!name){toast('请输入资源名称');return}let t=st.modal.resType;resources[t].unshift({id:t+'-'+Date.now(),name,detail:'演示资源 · 请在实际后端补全设置',meta:t==='model'?(st.modelTab==='CLI'?'CLI Proxy':'API Key'):'DEMO',status:'disabled',origin:'手工创建',model:t==='model'?'未指定型号':'',modelId:'请在真实设置中选择模型',provider:'未配置',endpoint:'尚未填写',credential:'未配置',account:'待关联账号',latency:'—',lastCheck:'未检测',quota:'未设置'});st.modal=null;st.modalInput='';render();toast('已创建演示资源（默认不可用）')}
function legacyActionHandler(raw,element){let [action,...args]=raw.split(':');if(action==='nav')navigate(element.dataset.route||args[0]);else if(action==='openAgent')openAgent(args[0]);else if(action==='collapse'){if(window.innerWidth<=700)st.mobileSidebarOpen=!st.mobileSidebarOpen;else st.sidebarCollapsed=!st.sidebarCollapsed;render()}else if(action==='closeMobile'){st.mobileSidebarOpen=false;render()}else if(action==='theme'){st.theme=st.theme==='light'?'dark':'light';render()}else if(action==='agentTab'){st.agentTab=element.dataset.tab||args[0];render()}else if(action==='configTab'){st.route='agent';st.agentTab='config';st.configTab=element.dataset.tab||args[0];render()}else if(action==='picker')openPicker(args[0]);else if(action==='pickerToggle'){let type=st.picker.type,r=res(type,args[0]);if(!r||r.status==='disabled'){toast('资源不可用，无法添加');return}if(type==='prompt')st.pickerSelection=[args[0]];else if(st.pickerSelection.includes(args[0]))st.pickerSelection=st.pickerSelection.filter(x=>x!==args[0]);else st.pickerSelection.push(args[0]);render()}else if(action==='pickerCommit')pickerCommit();else if(action==='closeOverlay')closeOverlay();else if(action==='remove')removeAsset(args[0],args[1]);else if(action==='moveModel')moveModel(Number(args[0]),Number(args[1]));else if(action==='agentMode'){curr().mode=args[0];render();toast('已更新当前 Agent 的模式（演示）')}else if(action==='saveConfig'){let area=document.getElementById('promptText');if(st.configTab==='prompt'&&area)curr().prompt=area.value;render();toast('配置已保存在演示状态中（未连接真实 API）')}else if(action==='saveBasics'){curr().name=document.getElementById('agentName')?.value.trim()||curr().name;curr().desc=document.getElementById('agentDesc')?.value||'';render();toast('基本信息已更新（演示）')}else if(action==='toggleAgent'){curr().status=curr().status==='active'?'paused':'active';render();toast('状态已切换（演示）')}else if(action==='confirmDelete'){st.modal={type:'deleteAgent'};render()}else if(action==='deleteAgent'){if(agents.length<=1){toast('演示环境至少保留一个 Agent');return}let i=agents.findIndex(a=>a.id===st.agentId);if(i>=0)agents.splice(i,1);st.agentId=agents[0].id;st.modal=null;navigate('agents');toast('已删除演示智能体')}else if(action==='createAgent'){st.modal={type:'createAgent'};st.modalInput='';render()}else if(action==='submitAgent')addAgent();else if(action==='createResource'){st.modal={type:'createResource',resType:args[0]};st.modalInput='';render()}else if(action==='submitResource')addResource();else if(action==='resourceDetail'){st.modal={type:'resourceDetail',resType:args[0],id:args[1]};render()}else if(action==='inspector'){st.inspector=!st.inspector;render()}else if(action==='clearChat'){st.chats=[];st.chatInput='';render();toast('已创建新的演示会话')}else if(action==='sendChat'){let input=document.getElementById('chatInput');let txt=(input?.value||'').trim();if(!txt)return;st.chats.push({role:'user',text:txt},{role:'assistant',text:'这是交互原型的模拟回复。\n\n在正式实现中，调试页将按照当前 Agent 的模型链、Prompt、Skills、MCP 与知识空间执行请求；展开右侧检查器即可查看模型、工具和用量等实际执行数据。'});st.chatInput='';render()}else if(action==='inspectRun'){st.inspectId=args[0];render()}else if(action==='notify'||action==='refresh')toast('此项为交互演示，未连接真实后端');else if(action==='globalSearch'){navigate('agents');let el=document.getElementById('filterAgents');el?.focus()}else if(action==='copyArchitecture'){let s='全局：总览 / 智能体 / 资源库（模型、Prompt、Skills、MCP、知识）/ 监控 / 系统。\nAgent：概览 / 配置（模型、Prompt、知识、工具）/ 调试 / 运行记录 / 设置。\n边界：平台管理资源，Agent 组合资源，调试验证执行。';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>toast('结构说明已复制')).catch(()=>toast('复制失败，请检查浏览器权限'));else toast('浏览器不支持剪贴板访问')}
}
document.addEventListener('click',event=>{let el=event.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='closeOverlay'&&el===event.target.closest('.backdrop,.dialog-backdrop')&&event.target.closest('.drawer,.dialog'))return;event.preventDefault();actionHandler(el.dataset.action,el)});
document.addEventListener('input',event=>{let el=event.target;if(el.id==='filterAgents'||el.id==='filterResources'){st.filter=el.value;preserveRender(el.id)}else if(el.id==='pickerSearch'){st.pickerSearch=el.value;preserveRender(el.id)}else if(el.id==='chatInput'){st.chatInput=el.value}else if(el.id==='modalInput'){st.modalInput=el.value}else if(el.id==='promptText'){let a=curr();a.prompt=el.value;let t=document.getElementById('promptLength');if(t)t.textContent=a.prompt.length+' / 8000'}else if(el.id==='agentName'||el.id==='agentDesc'){} });
document.addEventListener('change',event=>{let el=event.target;if(el.dataset.change==='filterStatus'){st.filterStatus=el.value;render()}else if(el.dataset.change==='mcpMode'){curr().mcpMode=el.value;render()}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&(st.modal||st.picker)){closeOverlay();return}if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();navigate('agents');document.getElementById('tableSearch')?.focus()}if(event.key==='Enter'&&!event.shiftKey&&document.activeElement?.id==='chatInput'){event.preventDefault();actionHandler('sendChat',document.activeElement)}if(event.key==='Enter'&&document.activeElement?.id==='modalInput'){event.preventDefault();actionHandler(st.modal?.type==='createAgent'?'submitAgent':'submitResource',document.activeElement)}});

// ---------- Reusable data table ----------
function tableState(key){return st.tables[key]||(st.tables[key]={q:'',status:'all',provider:'all',sort:'',desc:false,page:1,size:5,selected:[]})}
function currentTable(){if(st.route==='agents')return 'agents';if(st.route==='resource-model')return 'model-'+st.modelTab;if(st.route.startsWith('resource-'))return st.route.slice(9);if(st.route==='agent'&&st.agentTab==='history')return 'history-'+st.agentId;return 'agents'}
function isModelCli(r){return r.meta==='CLI Proxy'}
function statusName(s){return s==='active'||s==='healthy'?'正常':s==='paused'||s==='disabled'?'已停用':s==='warning'?'待检查':'未知'}
function statusStats(rows){return [['all','全部',rows.length],['healthy','可用',rows.filter(r=>r.status==='healthy'||r.status==='active').length],['warning','待检查',rows.filter(r=>r.status==='warning').length],['disabled','已停用',rows.filter(r=>r.status==='disabled'||r.status==='paused').length]]}
function tableResults(key,rows,extract){let t=tableState(key);let q=t.q.trim().toLocaleLowerCase(),filtered=rows.filter(r=>(!q||extract(r).toLocaleLowerCase().includes(q))&&(t.status==='all'||(t.status==='healthy'?['healthy','active'].includes(r.status):t.status==='disabled'?['disabled','paused'].includes(r.status):r.status===t.status))&&(t.provider==='all'||r.provider===t.provider));if(t.sort){filtered.sort((a,b)=>{let av=String(a[t.sort]??''),bv=String(b[t.sort]??'');return av.localeCompare(bv,'zh-CN',{numeric:true})*(t.desc?-1:1)})}let totalPages=Math.max(1,Math.ceil(filtered.length/t.size));t.page=Math.min(Math.max(t.page,1),totalPages);return {all:filtered,page:filtered.slice((t.page-1)*t.size,t.page*t.size),totalPages}}
function tableTh(key,label,field){let t=tableState(key);return `<button class="sort-head ${t.sort===field?'sorted':''}" data-action="tableSort:${field}" title="点击排序">${h(label)}<span class="sort-caret">${t.sort===field?(t.desc?'↓':'↑'):'↕'}</span></button>`}
function tableFilters(key,source,placeholder,showProvider=false){let t=tableState(key);let stats=statusStats(source);let prov=[...new Set(source.map(x=>x.provider).filter(Boolean))];return `<div class="data-tools"><div class="data-tools-left"><label class="search-field">${ic('search','sm')}<input id="tableSearch" data-input="tableSearch" placeholder="${h(placeholder)}" value="${h(t.q)}" aria-label="搜索表格"/></label><div class="row" style="gap:5px;flex-wrap:wrap">${stats.filter(x=>x[0]!=='warning'||x[2]).map(([status,label,n])=>`<button class="data-filter ${t.status===status?'active':''}" data-action="tableStatus:${status}">${label}<span class="count">${n}</span></button>`).join('')}</div></div><div class="data-tools-right">${showProvider?`<select class="select" data-change="providerFilter" aria-label="按供应商筛选"><option value="all">全部供应商</option>${prov.map(x=>`<option ${t.provider===x?'selected':''} value="${h(x)}">${h(x)}</option>`).join('')}</select>`:''}<div class="tabletool">${iconBtn('settings','tableMenu','列显示')}${st.tableMenu==='columns'&&st.tableMenuKey===key?`<div class="menu-floating"><div class="menu-label">显示 / 隐藏列</div>${(key==='agents'?[['type','智能体类型'],['resources','关联资源'],['updated','更新时间']]:key.startsWith('model-')?[['provider','供应商'],['latency','响应速度'],['lastCheck','最近检测']]:[['origin','来源'],['meta','版本/协议']]).map(([v,label])=>`<button class="menu-option" data-action="toggleColumn:${v}">${st.columnHidden[key]?.includes(v)?'□':'☑'} ${label}</button>`).join('')}</div>`:''}</div>${iconBtn('refresh','refreshTable','重置筛选')}</div></div>`}
function tableFoot(key,filtered){let t=tableState(key),pages=Math.max(1,Math.ceil(filtered.all.length/t.size)),start=filtered.all.length?(t.page-1)*t.size+1:0,end=Math.min(t.page*t.size,filtered.all.length);return `<div class="data-footer"><div>显示 ${start}–${end} / ${filtered.all.length} 条 <span style="margin-left:10px">每页 <select class="page-size" data-change="tableSize">${[5,10,20].map(n=>`<option value="${n}" ${t.size===n?'selected':''}>${n}</option>`).join('')}</select> 条</span></div><div class="page-controls"><span>第 ${t.page} / ${pages} 页</span><button class="page-btn" data-action="tablePage:1" ${t.page===1?'disabled':''} aria-label="第一页">«</button><button class="page-btn" data-action="tablePage:${t.page-1}" ${t.page===1?'disabled':''} aria-label="上一页">‹</button>${Array.from({length:pages},(_,i)=>i+1).filter(n=>Math.abs(n-t.page)<=1||n===1||n===pages).slice(0,7).map(n=>`<button class="page-btn ${t.page===n?'active':''}" data-action="tablePage:${n}">${n}</button>`).join('')}<button class="page-btn" data-action="tablePage:${t.page+1}" ${t.page>=pages?'disabled':''} aria-label="下一页">›</button><button class="page-btn" data-action="tablePage:${pages}" ${t.page>=pages?'disabled':''} aria-label="最后一页">»</button></div></div>`}

function tableActionHandler(raw,element){let [action,...args]=raw.split(':');if(action==='modelTab'){st.modelTab=args[0];st.tableMenu=null;st.rowMenu=null;render();return}if(action==='tableSort'){let t=tableState(currentTable());t.desc=t.sort===args[0]?!t.desc:false;t.sort=args[0];t.page=1;render();return}if(action==='tableStatus'){let t=tableState(currentTable());t.status=args[0];t.page=1;t.selected=[];render();return}if(action==='tablePage'){tableState(currentTable()).page=Number(args[0]);render();return}if(action==='tableMenu'){let key=currentTable();st.tableMenu=st.tableMenu==='columns'&&st.tableMenuKey===key?null:'columns';st.tableMenuKey=key;st.rowMenu=null;render();return}if(action==='toggleColumn'){let key=currentTable(),a=st.columnHidden[key]||(st.columnHidden[key]=[]);let i=a.indexOf(args[0]);i>=0?a.splice(i,1):a.push(args[0]);render();return}if(action==='refreshTable'){st.tables[currentTable()]={q:'',status:'all',provider:'all',sort:'',desc:false,page:1,size:5,selected:[]};st.tableMenu=null;render();toast('已重置筛选条件');return}if(action==='toggleRowMenu'){st.rowMenu=st.rowMenu?.kind===args[0]&&st.rowMenu?.id===args[1]?null:{kind:args[0],id:args[1]};st.tableMenu=null;render();return}if(action==='tableClearSelection'){tableState(currentTable()).selected=[];render();return}if(action==='bulkStatus'){let key=currentTable(),t=tableState(key),items=key==='agents'?agents:key.startsWith('model-')?resources.model:resources[key]||[];let count=0;for(let item of items){if(t.selected.includes(item.id)){item.status=key==='agents'?(args[0]==='active'?'active':'paused'):(args[0]==='active'?'healthy':'disabled');count++}}t.selected=[];render();toast(`已更新 ${count} 个演示条目`);return}if(action==='agentMenu'){st.agentMenu=!st.agentMenu;render();return}if(action==='agentStatus'){let a=agents.find(v=>v.id===args[0]);if(a){a.status=a.status==='active'?'paused':'active';st.agentMenu=false;st.rowMenu=null;render();toast('智能体状态已切换（仅演示）')}return}if(action==='agentDuplicate'){let a=agents.find(v=>v.id===args[0]);if(a){let copy=JSON.parse(JSON.stringify(a));copy.id='a'+agentSeq++;copy.name=a.name+' · 副本';copy.code=a.code+'-copy-'+copy.id;copy.status='paused';copy.updated='刚刚';agents.unshift(copy);st.agentMenu=false;st.rowMenu=null;navigate('agents');toast('已创建智能体副本（演示）')}return}if(action==='resourceStatus'){let r=res(args[0],args[1]);if(r){r.status=r.status==='disabled'?'healthy':'disabled';st.rowMenu=null;render();toast('资源状态已更新（演示）')}return}if(action==='resourceTest'){let r=res(args[0],args[1]);st.rowMenu=null;render();toast(`${r?.name||'资源'}：模拟连接测试已执行，不产生真实 API 请求`);return}if(action==='agentTab'){st.agentMenu=false;return legacyActionHandler(raw,element)}if(action==='nav'){st.rowMenu=null;st.agentMenu=false;return legacyActionHandler(raw,element)}if(action==='pickerToggle'){let t=st.picker?.type,r=res(t,args[0]);if(r?.status==='disabled'){toast('当前连接已停用，无法绑定');return}}
if(action==='openAgent'){st.rowMenu=null;st.agentMenu=false;return legacyActionHandler(raw,element)}
if(action==='createResource'){st.modal={type:'createResource',resType:args[0],modelTab:st.modelTab};st.modalInput='';render();return}
if(action==='resourceDetail'){st.rowMenu=null;st.modal={type:'resourceDetail',resType:args[0],id:args[1]};render();return}

 return `<div class="dialog-backdrop" data-action="closeOverlay"><div class="dialog" style="width:min(660px,calc(100vw - 32px));max-width:660px;max-height:calc(100vh - 48px);overflow:auto">
 <div class="row between" style="margin-bottom:9px"><h2>${isEdit?'编辑模型连接':'新增'+(cli?' CLI':' API Key')+' 连接'}</h2>${iconBtn('x','closeOverlay','关闭')}</div>
 <p>连接信息与实际模型版本分别配置。本原型只保存示例内容，不接受或保存真实密钥。</p>
 <div class="inline-notice" style="margin:15px 0">${ic(cli?'terminal':'key','sm')} ${cli?'CLI / OAuth：填写代理地址、账号名称及所需模型版本。':'API Key：填写接口地址和脱敏密钥标识，密钥本身应在真实系统中安全处理。'}</div>
 <div class="model-form-grid">
 ${input('editModelName','连接名称',d.name,cli?'Claude CLI · 主账号':'Anthropic · 生产连接')}
 <div class="form-row"><label class="label" for="editModelProvider">供应商</label><select id="editModelProvider" class="select" style="width:100%;height:39px">${['Anthropic','OpenAI','Google','OpenAI Compatible','Custom'].map(p=>`<option value="${p}" ${d.provider===p?'selected':''}>${p}</option>`).join('')}</select></div>
 ${input('editModelVersion','具体模型版本',d.model,'例如：Claude Opus 5.5','例如 Opus 5.5 / Opus 5.1；型号以真实接入返回为准。')}
 ${input('editModelId','请求模型 ID',d.modelId,'从供应商提供的模型目录选择','这是文本占位字段，不校验实际可用性。')}
 ${input('editModelAccount',cli?'CLI 账号 / 会话名称':'密钥配置名称',d.account,cli?'claude-cli-primary':'anthropic-prod')}
 ${input('editModelAuth',cli?'会话认证方式':'脱敏密钥标识',d.credential,cli?'OAuth / CLI Session':'sk-ant-...XXXX')}
 ${input('editModelEndpoint','接口 / 代理地址',d.endpoint,cli?'http://127.0.0.1:8010':'https://api.anthropic.com')}
 ${input('editModelQuota','配额或限额说明',d.quota,cli?'可用配额 80%':'80 RPM')}
 </div><div class="row" style="justify-content:flex-end;margin-top:23px">${button('取消','closeOverlay')}${button(`${ic('save','sm')} ${isEdit?'保存修改':'新增连接'}`,'submitModel','primary')}</div></div></div>`
}
function genericDialog(){
 return st.modal&&(st.modal.type==='editModel'||st.modal.type==='createResource'&&st.modal.resType==='model')?modelConnectionDialog():genericDialogV2();
}
function actionHandler(raw,element){
 let [action,...args]=raw.split(':');
 if(action==='createResource'&&args[0]==='model'){
   st.modal={type:'createResource',resType:'model',modelTab:st.modelTab};st.draftModel={provider:'Anthropic',credential:st.modelTab==='CLI'?'OAuth / CLI Session':''};render();return;
 }
 if(action==='editModel'){
   let r=res('model',args[0]);if(r){st.modal={type:'editModel',id:r.id};st.draftModel={...r};st.rowMenu=null;render()}return;
 }
 if(action==='submitModel'){
   let m=st.modal,isEdit=m.type==='editModel',r=isEdit?res('model',m.id):null;
   const get=id=>document.getElementById(id)?.value.trim()||'';
   const name=get('editModelName'),model=get('editModelVersion'),provider=get('editModelProvider'),modelId=get('editModelId'),endpoint=get('editModelEndpoint');
   if(!name||!model||!modelId||!endpoint){toast('请填写连接名称、模型版本、模型 ID 和接口地址');return}
   const cli=isEdit?isModelCli(r):m.modelTab==='CLI';
   const entry={name,model,provider,modelId,endpoint,credential:get('editModelAuth')||'未配置',account:get('editModelAccount')||'未填写',quota:get('editModelQuota')||'未设置',meta:cli?'CLI Proxy':'API Key',origin:cli?'CLI 代理':'官方 / 自定义接入',detail:(cli?'CLI Proxy · ':'API Key · ')+endpoint,latency:r?.latency||'—',lastCheck:r?.lastCheck||'未检测',status:r?.status||'disabled'};
   if(isEdit)Object.assign(r,entry);else resources.model.unshift({id:'model-'+Date.now(),...entry});
   st.modal=null;st.draftModel=null;render();toast(isEdit?'连接配置已更新（演示）':'连接已登记为停用状态（演示）');return;
 }
 return tableActionHandler(raw,element);
}

render();
</script>
